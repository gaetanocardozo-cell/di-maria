<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Di Maria Jawns - Movie Club</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Installable app: manifest, theme and icons -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jawns">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <meta name="description" content="Di Maria Jawns film club: logs, reviews, lists and club picks.">

  <!-- Perf: warm up the image + API origins before first paint -->
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
  <link rel="dns-prefetch" href="https://image.tmdb.org">
  <link rel="preconnect" href="https://api.themoviedb.org" crossorigin>
  <link rel="preconnect" href="https://kvgmsvjescscttzhavpk.supabase.co" crossorigin>
  <!-- Alpine.js (collapse plugin MUST load before core) -->
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- JSZip & PapaParse for Letterboxd ZIP parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    [x-cloak] { display: none !important; }

    /* One element wider than the viewport makes the browser widen the
       layout and scale everything down, which reads as "the tab is
       zoomed out". Two things cause it here:
         - text with no spaces (pasted links, long titles) cannot wrap
         - <input> has an intrinsic min-width and ignores flex shrinking */
    body { overflow-x: hidden; }
    p, h1, h2, h3, h4, span, li { overflow-wrap: break-word; }
    input, select, textarea { min-width: 0; }

    /* A visible scrollbar under the nav row looks like a mistake. */
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    /* Installed on a phone there is no browser chrome, so the app has to
       keep clear of the notch and the gesture bar itself. */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    /* Pull-to-refresh would reload the whole app mid-scroll. */
    html { overscroll-behavior-y: contain; }
    /* Stop iOS zooming the page when a text field is focused. */
    input, select, textarea { font-size: 16px; }
    @media (min-width: 640px) { input, select, textarea { font-size: inherit; } }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen font-sans flex flex-col">

<div x-data="app()" x-init="initApp()" class="flex-1 flex flex-col max-w-4xl w-full mx-auto p-4 md:p-6 pb-20">

  <!-- 1. ACCESS GATE / LOGIN & SIGNUP SCREEN -->
  <div x-show="!authenticated && !isBooting" x-cloak class="fixed inset-0 bg-neutral-950 flex items-center justify-center p-4 z-50">
    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl max-w-md w-full shadow-2xl overflow-hidden">
      
      <!-- Tab Switcher Header -->
      <div class="flex border-b border-neutral-800 bg-neutral-950/60 text-xs font-bold">
        <button 
          @click="authMode = 'login'; errorMessage = ''" 
          :class="authMode === 'login' ? 'text-amber-400 border-b-2 border-amber-400 bg-neutral-900' : 'text-neutral-400 hover:text-neutral-200'" 
          class="flex-1 py-3.5 transition-all text-center">
          Sign In
        </button>
        <button 
          @click="authMode = 'signup'; errorMessage = ''" 
          :class="authMode === 'signup' ? 'text-amber-400 border-b-2 border-amber-400 bg-neutral-900' : 'text-neutral-400 hover:text-neutral-200'" 
          class="flex-1 py-3.5 transition-all text-center">
          Register / Claim Account
        </button>
      </div>

      <div class="p-6 md:p-8 space-y-5 text-center">
        <h1 class="text-3xl font-extrabold text-amber-400 tracking-wider">DI MARIA JAWNS</h1>
        <p class="text-neutral-400 text-xs" x-text="authMode === 'login' ? 'Enter your handle and password to access the film club tracker.' : 'Claim your account or sign up using your handle, password, and the VIP invite code.'"></p>
        
        <!-- SIGN IN FORM -->
        <div x-show="authMode === 'login'" class="space-y-3">
          <input type="text" x-model="inputUsername" placeholder="Your Name / Handle" class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-4 py-2.5 text-neutral-100 text-sm focus:outline-none focus:border-amber-500">
          <input type="password" x-model="inputPassword" placeholder="Password" @keyup.enter="login()" class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-4 py-2.5 text-neutral-100 text-sm focus:outline-none focus:border-amber-500">
          
          <button @click="login()" :disabled="authLoading" class="w-full bg-amber-500 hover:bg-amber-400 text-neutral-950 font-bold py-2.5 rounded-lg transition-colors shadow-lg text-sm mt-2 disabled:opacity-60">
            <span x-show="!authLoading">Sign In</span>
            <span x-show="authLoading">Signing in...</span>
          </button>
        </div>

        <!-- SIGN UP / CLAIM ACCOUNT FORM -->
        <div x-show="authMode === 'signup'" class="space-y-3">
          <input type="text" x-model="inputUsername" placeholder="Your Handle (e.g. Asjawn)" class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-4 py-2.5 text-neutral-100 text-sm focus:outline-none focus:border-amber-500">
          <input type="password" x-model="inputPassword" placeholder="Create Password (min 6 chars)" class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-4 py-2.5 text-neutral-100 text-sm focus:outline-none focus:border-amber-500">
          <input type="password" x-model="inputCode" placeholder="VIP Invite Code (e.g. JAWN-VIP)" @keyup.enter="signUp()" class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-4 py-2.5 text-neutral-100 text-sm focus:outline-none focus:border-amber-500">

          <button @click="signUp()" :disabled="authLoading" class="w-full bg-amber-500 hover:bg-amber-400 text-neutral-950 font-bold py-2.5 rounded-lg transition-colors shadow-lg text-sm mt-2 disabled:opacity-60">
            <span x-show="!authLoading">Register Account</span>
            <span x-show="authLoading">Creating account...</span>
          </button>
        </div>

        <p x-show="errorMessage" x-text="errorMessage" class="text-red-400 text-xs mt-2"></p>
      </div>
    </div>
  </div>

  <!-- 2. MAIN APP INTERFACE -->
  <div x-show="authenticated" x-cloak class="flex-1 flex flex-col space-y-6">
    
    <!-- NAVBAR -->
    <header class="flex flex-col sm:flex-row items-center justify-between gap-4 pb-4 border-b border-neutral-800">
      <div class="flex items-center gap-3">
        <span class="text-2xl">🎬</span>
        <div>
          <h1 class="text-xl font-bold tracking-wider text-amber-400">DI MARIA JAWNS</h1>
          <p class="text-xs text-neutral-400">
            Member: <button @click="openMemberProfile(username); activeTab = 'profile'" class="text-amber-400 hover:underline font-semibold" x-text="username"></button>
            <button @click="logout()" class="ml-2 text-neutral-500 hover:text-red-400 underline transition-colors">Log Out</button>
          </p>
        </div>
      </div>

      <!-- A wrapping nav reflows into two or three ragged rows as the zoom
           level changes, which is what made the header look broken on a
           phone. One row that scrolls sideways behaves the same at every
           zoom level and matches how native apps do it. -->
      <!-- Below sm there is never room for nine tabs, so the row scrolls.
           From sm up it wraps instead: horizontal scrolling with a mouse is
           awkward, and a clipped tab looks like a rendering fault. -->
      <nav class="flex items-center gap-0.5 bg-neutral-900 border border-neutral-800 p-1 rounded-xl text-xs sm:text-sm
                  flex-nowrap overflow-x-auto no-scrollbar whitespace-nowrap
                  sm:flex-wrap sm:overflow-visible sm:whitespace-normal max-w-full">
        <button @click="activeTab = 'home'" :class="activeTab === 'home' ? 'bg-amber-500 text-neutral-950 font-bold' : 'text-neutral-400 hover:text-neutral-200'" class="px-2.5 py-1.5 rounded-lg transition-all flex-shrink-0">Home</button>
        <button @click="openMemberProfile(username); activeTab = 'profile'" :class="activeTab === 'profile' ? 'bg-amber-500 text-neutral-950 font-bold' : 'text-neutral-400 hover:text-neutral-200'" class="px-2.5 py-1.5 rounded-lg transition-all flex-shrink-0">Profile</button>
        <button @click="activeTab = 'feed'" :class="activeTab === 'feed' ? 'bg-amber-500 text-neutral-950 font-bold' : 'text-neutral-400 hover:text-neutral-200'" class="px-2.5 py-1.5 rounded-lg transition-all flex-shrink-0">Feed</button>
        <button @click="activeTab = 'club'" :class="activeTab === 'club' ? 'bg-amber-500 text-neutral-950 font-bold' : 'text-neutral-400 hover:text-neutral-200'" class="px-2.5 py-1.5 rounded-lg transition-all flex-shrink-0">Film Club</button>
        <button @click="activeTab = 'top20'" :class="activeTab === 'top20' ? 'bg-amber-500 text-neutral-950 font-bold' : 'text-neutral-400 hover:text-neutral-200'" class="px-2.5 py-1.5 rounded-lg transition-all flex-shrink-0">Top 20 / Stats</button>
        <button @click="activeTab = 'lists'" :class="activeTab === 'lists' ? 'bg-amber-500 text-neutral-950 font-bold' : 'text-neutral-400 hover:text-neutral-200'" class="px-2.5 py-1.5 rounded-lg transition-all flex-shrink-0">Lists</button>
        <button @click="activeTab = 'calendar'" :class="activeTab === 'calendar' ? 'bg-amber-500 text-neutral-950 font-bold' : 'text-neutral-400 hover:text-neutral-200'" class="px-2.5 py-1.5 rounded-lg transition-all flex-shrink-0">Diary</button>
        <button @click="activeTab = 'members'" :class="activeTab === 'members' ? 'bg-amber-500 text-neutral-950 font-bold' : 'text-neutral-400 hover:text-neutral-200'" class="px-2.5 py-1.5 rounded-lg transition-all flex-shrink-0">Members</button>
        <button @click="activeTab = 'news'" :class="activeTab === 'news' ? 'bg-amber-500 text-neutral-950 font-bold' : 'text-neutral-400 hover:text-neutral-200'" class="px-2.5 py-1.5 rounded-lg transition-all flex-shrink-0">📣 News</button>
        <button @click="activeTab = 'search'" :class="activeTab === 'search' ? 'bg-amber-500 text-neutral-950 font-bold' : 'text-neutral-400 hover:text-neutral-200'" class="px-2.5 py-1.5 rounded-lg transition-all flex-shrink-0">🔍 Search</button>
      </nav>
    </header>

    <!-- TAB 0: HOMEPAGE -->
    <template x-if="activeTab === 'home'">
    <main class="space-y-8 pb-12">
      <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-5 sm:p-6 shadow-2xl flex flex-col sm:flex-row items-center gap-6">
        <div class="w-full sm:w-1/2 flex justify-center items-center bg-neutral-950/80 rounded-xl p-2 border border-neutral-800/80">
          <img loading="eager" fetchpriority="high" decoding="async" src="https://i.postimg.cc/yNMP6CjF/94f007e6-4f2b-4c86-abd8-d7fab834839b.jpg" alt="David Lynch - The Website" class="max-h-72 sm:max-h-80 w-auto object-contain rounded-lg shadow-md">
        </div>
        <div class="w-full sm:w-1/2 space-y-2 text-center sm:text-left">
          <span class="text-amber-400 font-bold text-xs uppercase tracking-widest">Official Tracker</span>
          <h2 class="text-3xl sm:text-4xl font-black text-neutral-100 tracking-wider">DI MARIA JAWNS</h2>
          <p class="text-xs sm:text-sm text-neutral-300 max-w-lg">Track, rate, discuss cinema, and share lists with the club.</p>
        </div>
      </div>

      <!-- FAVOURITE LISTS -->
      <template x-if="getFavoriteLists().length > 0">
        <div class="space-y-4">
          <div class="flex justify-between items-center">
            <div>
              <h3 class="text-lg font-bold text-neutral-100 flex items-center gap-2">⭐ Favourite Lists</h3>
              <p class="text-xs text-neutral-400">The club's canon, as voted by its lists</p>
            </div>
            <button @click="activeTab = 'lists'; listFilter = 'fav'" class="text-xs text-amber-400 hover:underline font-semibold flex-shrink-0">See all &rarr;</button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <template x-for="list in getFavoriteLists().slice(0, 4)" :key="list.id">
              <div @click="openListDetail(list)"
                class="bg-neutral-900 border border-neutral-800 hover:border-amber-500/50 rounded-xl p-4 space-y-3 cursor-pointer transition-colors">
                <div class="min-w-0">
                  <h4 class="font-bold text-neutral-100 truncate flex items-center gap-1.5">
                    <span class="text-amber-400 text-sm">⭐</span>
                    <span x-text="list.title"></span>
                  </h4>
                  <p class="text-[11px] text-neutral-500 mt-0.5">
                    by <span class="text-neutral-400" x-text="list.username"></span>
                    · <span x-text="getListItems(list).length"></span> films
                  </p>
                </div>
                <div class="flex gap-1.5 overflow-hidden">
                  <template x-for="item in getListItems(list).slice(0, 7)" :key="item.id || item.title">
                    <div class="relative w-9 flex-shrink-0" style="height:3.375rem">
                      <img loading="lazy" decoding="async" :src="item.poster_path ? 'https://image.tmdb.org/t/p/w200' + item.poster_path : POSTER_FALLBACK" class="w-9 h-full object-cover rounded border border-neutral-800">
                      <template x-if="isSeries(item)">
                        <span class="absolute -top-1 -left-1 text-[7px] bg-sky-500 text-neutral-950 px-1 rounded font-bold uppercase">TV</span>
                      </template>
                    </div>
                  </template>
                  <template x-if="getListItems(list).length === 0">
                    <p class="text-[10px] text-neutral-600 italic">Empty list</p>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <div class="space-y-4">
        <div class="flex justify-between items-center">
          <div>
            <h3 class="text-lg font-bold text-neutral-100 flex items-center gap-2">🔥 Latest Logs</h3>
            <p class="text-xs text-neutral-400">Fresh reviews from club members</p>
          </div>
          <button @click="activeTab = 'feed'" class="text-xs text-amber-400 hover:underline font-semibold">View All Feed &rarr;</button>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
          <template x-for="log in logs.slice(0, 4)" :key="log.id">
            <div class="bg-neutral-900 border border-neutral-800 hover:border-amber-500/50 rounded-xl overflow-hidden transition-all hover:-translate-y-1 flex flex-col group">
              <div class="aspect-[2/3] bg-neutral-800 overflow-hidden relative cursor-pointer">
                <img loading="lazy" decoding="async" @click="openReviewDetails(log)" :src="log.poster_path ? 'https://image.tmdb.org/t/p/w300' + log.poster_path : POSTER_FALLBACK" class="w-full h-full object-cover">
                
                <div class="absolute top-2 right-2 bg-neutral-950/80 backdrop-blur-md text-xs font-mono font-bold px-2 py-0.5 rounded-md border border-neutral-700 flex items-center gap-1">
                  <span x-text="log.rating ? '★ ' + log.rating : '👁️ Watched'" :class="log.rating ? 'text-amber-400' : 'text-neutral-400'"></span>
                  <template x-if="log.is_rewatch">
                    <span title="Rewatch" class="text-[10px] text-sky-400">🔁</span>
                  </template>
                </div>

                <template x-if="isOwner(log)">
                  <div @click.stop="openLogPosterPicker(log)" class="absolute inset-0 bg-black/80 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center p-2 text-center">
                    <span class="text-xs font-bold text-amber-400">📷 Swap Poster</span>
                  </div>
                </template>
              </div>
              <div class="p-3 flex-1 flex flex-col justify-between">
                <template x-if="log.fav_performance">
                  <span class="text-[10px] text-amber-400 font-semibold block truncate order-2 mt-1">🌟 <span x-text="log.fav_performance"></span></span>
                </template>
                <div>
                  <h4 @click="openReviewDetails(log)" class="font-bold text-xs text-neutral-100 truncate cursor-pointer hover:text-amber-400" x-text="log.movie_title"></h4>
                  <p class="text-[10px] text-neutral-400 mt-0.5 truncate">by <span class="text-amber-400 font-medium" x-text="log.username || 'Anonymous'"></span></p>
                </div>
              </div>
            </div>
          </template>

          <div x-show="logs.length === 0" class="col-span-4 text-center py-8 text-neutral-500 bg-neutral-900/50 rounded-xl border border-neutral-800">
            <p class="text-xs">No movies logged yet. Be the first!</p>
          </div>
        </div>
      </div>
    </main>
    </template>

    <!-- TAB 1: USER PROFILE TAB -->
    <template x-if="activeTab === 'profile'">
    <main class="space-y-6 pb-12">
      <div class="bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden shadow-xl">
        <div class="h-44 sm:h-56 w-full relative bg-cover bg-center" :style="getProfileBannerStyle(activeMemberProfile)">
          <div class="absolute inset-0 bg-gradient-to-t from-neutral-900 via-neutral-900/40 to-transparent"></div>
        </div>

        <div class="p-6 -mt-16 sm:-mt-20 relative space-y-6">
          <div class="flex flex-col sm:flex-row items-center sm:items-end gap-4 pb-6 border-b border-neutral-800 text-center sm:text-left">
            <template x-if="getProfile(activeMemberProfile)?.avatar_url">
              <img loading="lazy" decoding="async" :src="getProfile(activeMemberProfile).avatar_url" class="w-24 h-24 rounded-full object-cover border-4 border-amber-400 shadow-2xl flex-shrink-0">
            </template>
            <template x-if="!getProfile(activeMemberProfile)?.avatar_url">
              <div class="w-24 h-24 bg-amber-500 text-neutral-950 font-black rounded-full flex items-center justify-center text-4xl uppercase border-4 border-amber-400 shadow-2xl flex-shrink-0" x-text="(activeMemberProfile || 'MJ').substring(0,2)"></div>
            </template>

            <div class="flex-1 space-y-1">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <h2 class="text-3xl font-black text-neutral-100 tracking-wide" x-text="activeMemberProfile"></h2>
                
                <template x-if="activeMemberProfile.trim().toLowerCase() === username.trim().toLowerCase()">
                  <div class="flex items-center gap-2 flex-wrap">
                    <button @click="enrichMissingMetadata(true)" :disabled="isEnriching" class="bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 text-sky-400 font-bold text-xs px-3 py-2 rounded-xl transition-colors shadow flex items-center gap-1.5 disabled:opacity-50">
                      <span x-show="!isEnriching">⚡ Sync Metadata</span>
                      <span x-show="isEnriching" class="animate-pulse">Syncing...</span>
                    </button>
                    <button @click="openIssueScanner()" class="bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 text-rose-400 font-bold text-xs px-3.5 py-2 rounded-xl transition-colors shadow">
                      🔍 Check Matches
                    </button>
                    <button @click="showImportModal = true" class="bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 text-amber-400 font-bold text-xs px-3.5 py-2 rounded-xl transition-colors shadow">
                      📥 Import Letterboxd
                    </button>
                    <button @click="openProfileEditor()" class="bg-amber-500 hover:bg-amber-400 text-neutral-950 font-bold text-xs px-3.5 py-2 rounded-xl transition-colors shadow">
                      ✏️ Edit Profile
                    </button>
                  </div>
                </template>
              </div>
              
              <template x-if="enrichStatus">
                <p class="text-[11px] text-amber-400 font-mono pt-1" x-text="enrichStatus"></p>
              </template>

              <div class="flex items-center gap-3 text-xs text-neutral-400 pt-0.5">
                <span x-text="getMemberLogs(activeMemberProfile).length + ' movies logged'"></span>
                <span>•</span>
                <span x-text="getMemberWatchlist(activeMemberProfile).length + ' in watchlist'"></span>
              </div>
              <template x-if="getProfile(activeMemberProfile)?.bio">
                <p class="text-sm text-neutral-200 italic pt-1" x-text="'&ldquo;' + getProfile(activeMemberProfile).bio + '&rdquo;'"></p>
              </template>
            </div>
          </div>

          <!-- FAVORITE CREATIVES -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-neutral-950 p-3.5 rounded-xl border border-neutral-800 flex items-center gap-3">
              <template x-if="getPersonObj(getProfile(activeMemberProfile)?.fav_director)?.profile_path">
                <img loading="lazy" decoding="async" :src="'https://image.tmdb.org/t/p/w185' + getPersonObj(getProfile(activeMemberProfile)?.fav_director).profile_path" class="w-12 h-12 rounded-full object-cover border border-amber-500/40">
              </template>
              <template x-if="!getPersonObj(getProfile(activeMemberProfile)?.fav_director)?.profile_path">
                <div class="w-12 h-12 rounded-full bg-neutral-800 border border-neutral-700 flex items-center justify-center text-lg">🎬</div>
              </template>
              <div class="min-w-0">
                <span class="text-neutral-500 text-[10px] uppercase font-bold block">Fav Director</span>
                <span class="text-amber-400 font-semibold text-xs truncate block" x-text="getPersonName(getProfile(activeMemberProfile)?.fav_director) || 'Not set'"></span>
              </div>
            </div>

            <div class="bg-neutral-950 p-3.5 rounded-xl border border-neutral-800 flex items-center gap-3">
              <template x-if="getPersonObj(getProfile(activeMemberProfile)?.fav_actor)?.profile_path">
                <img loading="lazy" decoding="async" :src="'https://image.tmdb.org/t/p/w185' + getPersonObj(getProfile(activeMemberProfile)?.fav_actor).profile_path" class="w-12 h-12 rounded-full object-cover border border-amber-500/40">
              </template>
              <template x-if="!getPersonObj(getProfile(activeMemberProfile)?.fav_actor)?.profile_path">
                <div class="w-12 h-12 rounded-full bg-neutral-800 border border-neutral-700 flex items-center justify-center text-lg">🎭</div>
              </template>
              <div class="min-w-0">
                <span class="text-neutral-500 text-[10px] uppercase font-bold block">Fav Actor</span>
                <span class="text-amber-400 font-semibold text-xs truncate block" x-text="getPersonName(getProfile(activeMemberProfile)?.fav_actor) || 'Not set'"></span>
              </div>
            </div>

            <div class="bg-neutral-950 p-3.5 rounded-xl border border-neutral-800 flex items-center gap-3">
              <template x-if="getPersonObj(getProfile(activeMemberProfile)?.fav_actress)?.profile_path">
                <img loading="lazy" decoding="async" :src="'https://image.tmdb.org/t/p/w185' + getPersonObj(getProfile(activeMemberProfile)?.fav_actress).profile_path" class="w-12 h-12 rounded-full object-cover border border-amber-500/40">
              </template>
              <template x-if="!getPersonObj(getProfile(activeMemberProfile)?.fav_actress)?.profile_path">
                <div class="w-12 h-12 rounded-full bg-neutral-800 border border-neutral-700 flex items-center justify-center text-lg">🌟</div>
              </template>
              <div class="min-w-0">
                <span class="text-neutral-500 text-[10px] uppercase font-bold block">Fav Actress</span>

  <!-- DEDICATED REVIEW MODAL -->

            <template x-if="selectedReviewDetail?.director">
              <p class="text-[11px] text-neutral-400">Directed by <span class="text-neutral-300" x-text="selectedReviewDetail.director"></span></p>

        <!-- QUICK EDITS: change a rating or a date without reopening the log -->
        <template x-if="isOwner(selectedReviewDetail)">

                    :class="(v * 2) % 2 === 0 ? '' : '-mr-1'">
                    <span class="text-sm leading-none"
                      :class="selectedReviewDetail.rating !== null && Number(selectedReviewDetail.rating) >= v ? 'text-amber-400' : 'text-neutral-700'"

              </div>

        <div class="space-y-2">

          <p class="text-sm text-neutral-200 whitespace-pre-line leading-relaxed bg-neutral-950/60 p-4 rounded-xl border border-neutral-800/80" x-text="selectedReviewDetail?.review || 'Logged without written notes.'"></p>
        </div>

        <template x-if="selectedReviewDetail?.stills && selectedReviewDetail.stills.length > 0">

                    <span class="absolute top-1 left-1 bg-amber-500 text-neutral-950 text-[8px] font-bold px-1.5 py-0.5 rounded uppercase">Header</span>
                  </template>
                  <template x-if="isOwner(selectedReviewDetail) && sIdx !== 0">
                    <button @click="setHeaderStill(selectedReviewDetail, st)" :disabled="quickEditBusy"

        <div class="space-y-3 pt-3 border-t border-neutral-800">
          <h4 class="text-xs font-bold uppercase tracking-wider text-neutral-400">Comments (<span x-text="getCommentsForLog(selectedReviewDetail?.id).length"></span>)</h4>
          
          <div class="space-y-2 max-h-40 overflow-y-auto">
            <template x-for="c in getCommentsForLog(selectedReviewDetail?.id)" :key="c.id">
              <div class="bg-neutral-950 p-2.5 rounded-lg border border-neutral-800 text-xs flex justify-between items-start">
                <div><span class="font-bold text-amber-400" x-text="c.username"></span>: <span class="text-neutral-200" x-text="c.comment_text"></span></div>
                <template x-if="c.username.trim().toLowerCase() === username.trim().toLowerCase()">
                  <button @click="deleteComment(c.id)" class="text-neutral-500 hover:text-red-400 font-bold px-1">&times;</button>
                </template>
              </div>
            </template>
          </div>

          <div class="flex gap-2">
            <input type="text" x-model="commentInputs[selectedReviewDetail?.id]" @keyup.enter="submitComment(selectedReviewDetail?.id)" placeholder="Write a comment..." class="flex-1 bg-neutral-800 text-xs px-3 py-2 rounded-xl border border-neutral-700 text-neutral-100 focus:outline-none">
            <button @click="submitComment(selectedReviewDetail?.id)" class="bg-amber-500 text-neutral-950 font-bold px-4 py-2 text-xs rounded-xl">Post</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  </template>

  <!-- LOG / EDIT MODAL -->
  <template x-if="showLogModal">
  <div x-cloak class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-start justify-center p-4 z-50 overflow-y-auto">
    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl max-w-lg w-full p-6 space-y-5 relative shadow-2xl my-6 sm:my-10">

      <div x-show="selectedMovie" class="flex gap-4 items-center">
        <img loading="lazy" decoding="async" :src="selectedMovie?.poster_path ? 'https://image.tmdb.org/t/p/w200' + selectedMovie.poster_path : POSTER_FALLBACK" class="w-16 h-24 object-cover rounded-lg">

          <span x-show="isEditing" class="text-[10px] text-amber-400 font-bold uppercase tracking-wider">Editing Your Review</span>
          <h3 class="text-lg font-bold text-neutral-100" x-text="selectedMovie?.title"></h3>
          <p class="text-xs text-neutral-400" x-text="selectedMovie?.release_date ? selectedMovie.release_date.substring(0,4) : ''"></p>
        </div>
      </div>

      <div class="space-y-4">
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="block text-xs uppercase font-bold text-neutral-400">
              Rating: <span class="text-amber-400 font-mono font-extrabold" x-text="newLog.rating ? newLog.rating + ' / 5' : 'Unrated'"></span>
            </label>
            <button type="button" @click="newLog.rating = null" class="text-[10px] text-neutral-400 hover:text-amber-400 underline">Set as Unrated</button>
          </div>
          <div class="grid grid-cols-5 gap-1.5">
            <template x-for="r in [0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0]" :key="r">
              <button type="button" @click="newLog.rating = r"

                class="py-1.5 px-2 text-xs rounded-lg border transition-colors flex items-center justify-center gap-0.5">
                <span x-text="r"></span>★
              </button>
            </template>
          </div>
        </div>

        <div class="flex items-center gap-3 bg-neutral-800/60 p-3 rounded-xl border border-neutral-700">

          <label for="rewatchCheck" class="text-xs font-semibold text-neutral-200 cursor-pointer select-none">

            <option value="">-- Pick Favorite Actor / Role (Optional) --</option>
            <template x-for="actor in logCastList" :key="actor.name">
              <option :value="actor.name + ' (' + actor.character + ')'" x-text="actor.name + ' as ' + actor.character"></option>

        </div>

        <div class="space-y-2">
          <div class="flex justify-between items-center">

              <div class="relative group aspect-video rounded-lg overflow-hidden border border-neutral-700 bg-neutral-950">

                <button @click="newLog.stills.splice(idx, 1)" class="absolute top-1 right-1 bg-black/80 hover:bg-red-600 text-white rounded-full w-4 h-4 text-[10px] flex items-center justify-center font-bold">&times;</button>
              </div>

          </div>

        <div>
          <label class="block text-xs uppercase font-bold text-neutral-400 mb-2">Review / Notes</label>
          <textarea x-model="newLog.review" rows="4" placeholder="What did you think of this jawn?" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-3 text-neutral-100 text-sm focus:outline-none focus:border-amber-500"></textarea>
        </div>

        <div class="bg-neutral-800/60 p-4 rounded-xl border border-neutral-700 space-y-3">

          </div>
        </div>
      </div>

      <button @click="saveLog()" class="w-full bg-amber-500 hover:bg-amber-400 text-neutral-950 font-bold py-3 rounded-xl transition-colors" x-text="isEditing ? 'Update Review' : 'Save Log'">
      </button>
    </div>
  </div>

  <!-- MOVIE STILLS PICKER MODAL -->
  <template x-if="showStillsModal">
  <div x-cloak class="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">

  <!-- LETTERBOXD IMPORT MODAL -->
  <template x-if="showImportModal">
  <div x-cloak class="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50 overflow-y-auto">
    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl max-w-lg w-full p-6 space-y-5 relative shadow-2xl">
      <button @click="showImportModal = false" class="absolute top-4 right-4 text-neutral-400 hover:text-neutral-100 text-xl font-bold">&times;</button>
      <h3 class="text-2xl font-black text-amber-400">📥 Import Letterboxd Export ZIP</h3>
      
      <!-- CHECKBOX SELECTION FOR ZIP CONTENTS -->
      <div class="space-y-3 bg-neutral-950 p-4 rounded-xl border border-neutral-800 text-xs">
        <p class="font-bold text-neutral-300 uppercase tracking-wider text-[11px]">Select Items to Import:</p>
        <div class="grid grid-cols-2 gap-2 text-neutral-300">
          <label class="flex items-center gap-2 cursor-pointer hover:text-amber-400">
            <input type="checkbox" x-model="importOpts.diary" class="accent-amber-500 rounded">
            <span>📖 Diary / Logs</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer hover:text-amber-400">
            <input type="checkbox" x-model="importOpts.ratings" class="accent-amber-500 rounded">
            <span>★ Ratings</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer hover:text-amber-400">
            <input type="checkbox" x-model="importOpts.watched" class="accent-amber-500 rounded">
            <span>👁️ Watched History</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer hover:text-amber-400">
            <input type="checkbox" x-model="importOpts.watchlist" class="accent-amber-500 rounded">
            <span>📌 Watchlist</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer hover:text-amber-400">
            <input type="checkbox" x-model="importOpts.reviews" class="accent-amber-500 rounded">
            <span>✍️ Review Text</span>
          </label>
        </div>

        <div class="pt-3 mt-1 border-t border-neutral-800 space-y-2.5">
          <div class="flex items-center justify-between gap-2">
            <span class="text-neutral-300">Duplicate handling</span>
            <select x-model="dupeMode" class="bg-neutral-800 border border-neutral-700 text-amber-400 rounded-lg px-2 py-1 text-[11px] focus:outline-none">
              <option value="viewing">One log per viewing date</option>
              <option value="film">One log per film</option>
            </select>
          </div>
          <label class="flex items-start gap-2 cursor-pointer hover:text-amber-400 text-neutral-300">
            <input type="checkbox" x-model="importOpts.overwrite" class="accent-amber-500 rounded mt-0.5">
            <span>Update logs I already have with reviews &amp; ratings from this export</span>
          </label>
        </div>
      </div>

      <!-- DRAG AND DROP / FILE SELECT BOX -->
      <div 
        @dragover.prevent="isDraggingZip = true" 
        @dragleave.prevent="isDraggingZip = false" 
        @drop.prevent="handleZipDrop($event)"
        :class="isDraggingZip ? 'border-amber-400 bg-amber-500/10' : 'border-neutral-700 bg-neutral-950/60'"
        class="border-2 border-dashed rounded-2xl p-8 text-center space-y-3 cursor-pointer relative">
        <input type="file" accept=".zip" @change="handleZipSelect($event)" class="absolute inset-0 opacity-0 cursor-pointer">
        <span class="text-4xl block">📦</span>
        <p class="text-sm font-bold text-neutral-200">Drag & Drop your Letterboxd ZIP here</p>
        <p class="text-xs text-neutral-400">or click to browse your computer</p>
      </div>

      <div x-show="importStatus" class="bg-neutral-950 p-3 rounded-xl border border-neutral-800 text-xs text-center space-y-1">
        <p x-text="importStatus" class="font-bold text-amber-400"></p>
        <p x-text="importProgressText" class="text-[10px] text-neutral-400"></p>
      </div>

      <template x-if="importReport">
        <div class="bg-neutral-950 p-4 rounded-xl border border-neutral-800 text-[11px] space-y-1.5">
          <p class="font-bold text-neutral-200 uppercase tracking-wider text-[10px]">Import Summary</p>
          <div class="flex justify-between"><span class="text-neutral-400">Files read</span><span class="text-neutral-200 font-mono" x-text="importReport.files"></span></div>
          <div class="flex justify-between"><span class="text-neutral-400">Distinct viewings found</span><span class="text-neutral-200 font-mono" x-text="importReport.viewings"></span></div>
          <div class="flex justify-between"><span class="text-neutral-400">New logs added</span><span class="text-amber-400 font-mono font-bold" x-text="importReport.inserted"></span></div>
          <div class="flex justify-between"><span class="text-neutral-400">Already in your library</span><span class="text-neutral-200 font-mono" x-text="importReport.skipped"></span></div>
          <div class="flex justify-between"><span class="text-neutral-400">Existing logs updated</span><span class="text-neutral-200 font-mono" x-text="importReport.updated"></span></div>
          <div class="flex justify-between"><span class="text-neutral-400">Reviews matched to a viewing</span><span class="text-sky-400 font-mono" x-text="importReport.reviews"></span></div>
          <div class="flex justify-between"><span class="text-neutral-400">Watchlist added / skipped</span><span class="text-neutral-200 font-mono"><span x-text="importReport.watchlistAdded"></span> / <span x-text="importReport.watchlistSkipped"></span></span></div>
        </div>

      <button @click="showIssueScanModal = false" class="absolute top-4 right-4 text-neutral-400 hover:text-neutral-100 text-xl font-bold">&times;</button>
      <div>
        <h3 class="text-2xl font-black text-amber-400">🔍 Check TMDB Matches</h3>
        <p class="text-xs text-neutral-400 mt-1">

          in one pass instead of one at a time.
        </p>
      </div>

      <!-- SCOPE + ACTIONS -->
      <div class="bg-neutral-950 p-4 rounded-xl border border-neutral-800 space-y-3">
        <div class="flex items-center justify-between gap-3 flex-wrap">
          <div class="flex items-center gap-2">
            <span class="text-[11px] text-neutral-400">Check</span>
            <div class="flex items-center bg-neutral-900 border border-neutral-800 p-1 rounded-lg text-[11px]">
              <button @click="issueScope = 'mine'; scanForIssues()" :class="issueScope === 'mine' ? 'bg-amber-500 text-neutral-950 font-bold' : 'text-neutral-400 hover:text-neutral-200'" class="px-2.5 py-1 rounded transition-all">My logs</button>
              <button @click="issueScope = 'all'; scanForIssues()" :class="issueScope === 'all' ? 'bg-amber-500 text-neutral-950 font-bold' : 'text-neutral-400 hover:text-neutral-200'" class="px-2.5 py-1 rounded transition-all">Whole club</button>
            </div>
          </div>
          <button @click="deepVerifyIssues()" :disabled="issueBusy"
            class="bg-sky-500/15 hover:bg-sky-500 border border-sky-500/40 text-sky-400 hover:text-neutral-950 font-bold text-[11px] px-3.5 py-2 rounded-xl transition-colors disabled:opacity-50">
            <span x-show="!issueBusy">🛰️ Verify every film against TMDB</span>
            <span x-show="issueBusy" class="animate-pulse">Checking...</span>
          </button>
          <button x-show="issueBusy" @click="issueCancel = true"
            class="flex-shrink-0 bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 text-neutral-300 font-bold text-[11px] px-3 py-2 rounded-xl transition-colors">
            Stop

        </div>
        <p class="text-[10px] text-neutral-500">
          The quick scan is instant and only spots contradictions already visible in your data. Verifying
          asks TMDB what each film actually is, which catches everything but takes a minute or two.
        </p>
      </div>

      <!-- LISTS OUT OF SYNC WITH LOGS -->
      <template x-if="listSync && listSync.entries > 0">
        <div class="bg-neutral-950 p-4 rounded-xl border border-sky-500/30 space-y-3">
          <div class="flex items-start justify-between gap-3 flex-wrap">
            <div class="min-w-0">

                across <span x-text="listSync.lists.length"></span> list<span x-show="listSync.lists.length !== 1">s</span>

              <span x-show="!listSyncBusy">Bring lists in line</span>
              <span x-show="listSyncBusy" class="animate-pulse">Working...</span>
            </button>
          </div>

              <div class="flex items-center gap-2 text-[10px]">

                <span class="text-sky-400 font-mono ml-auto flex-shrink-0" x-text="ref.count + ' to fix'"></span>

            </template>

          <p x-show="issueProgress" x-text="issueProgress" class="text-[10px] text-neutral-400"></p>

      </template>

      <!-- SUMMARY -->
      <template x-if="issueResults">

          <div class="bg-neutral-950 border border-amber-500/30 rounded-xl p-3">
            <p class="text-lg font-black text-amber-400" x-text="issueResults.medium"></p>
            <p class="text-[9px] uppercase tracking-wider text-neutral-500">worth a look</p>
          </div>
          <div class="bg-neutral-950 border border-neutral-800 rounded-xl p-3">
            <p class="text-lg font-black text-sky-400" x-text="issueResults.fixable || 0"></p>
            <p class="text-[9px] uppercase tracking-wider text-neutral-500">auto-fixable</p>
          </div>
        </div>
      </template>

      <template x-if="issueResults && issueResults.issues.length === 0">
        <p class="text-center text-emerald-400 text-sm font-semibold py-6">No problems found. Your library looks clean.</p>

      <!-- ISSUE LIST -->
      <template x-if="issueResults && issueResults.issues.length > 0">
        <div class="space-y-3">
          <div class="flex items-center justify-between gap-2">
            <p class="text-[11px] uppercase font-bold text-neutral-400 tracking-wider">

            <div class="flex gap-2 text-[10px] items-center">

              <template x-if="dismissedIssues.length > 0">

                  <span class="text-neutral-700">|</span>
                  <button @click="restoreDismissed()" class="text-neutral-500 hover:text-amber-400 font-bold"

                </span>
              </template>
            </div>
          </div>

          <div class="space-y-1.5 max-h-96 overflow-y-auto pr-1">
            <template x-for="issue in issueResults.issues" :key="issue.key">
              <div class="bg-neutral-950 border rounded-xl p-3 flex gap-3 items-start"
                   :class="issue.severity === 'high' ? 'border-red-500/30' : (issue.severity === 'medium' ? 'border-amber-500/25' : 'border-neutral-800')">
                <input type="checkbox" x-model="issue.selected" :disabled="!issue.suggested" class="accent-amber-500 rounded mt-1 flex-shrink-0 disabled:opacity-25">

                <div class="min-w-0 flex-1 space-y-1">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-xs font-bold text-neutral-100 truncate" x-text="issue.title"></span>
                    <span class="text-[10px] text-neutral-500" x-text="issue.year || 'no year'"></span>
                    <span class="text-[9px] px-1.5 py-0.5 rounded font-bold"
                          :class="issue.severity === 'high' ? 'bg-red-500/15 text-red-400 border border-red-500/30' : (issue.severity === 'medium' ? 'bg-amber-500/15 text-amber-400 border border-amber-500/30' : 'bg-neutral-800 text-neutral-400 border border-neutral-700')"
                          x-text="!issueVerified ? 'unverified' : (issue.severity === 'high' ? 'likely wrong' : (issue.severity === 'medium' ? 'check' : 'minor'))"></span>
                    <span class="text-[9px] text-neutral-600" x-text="issue.count + (issue.count === 1 ? ' log' : ' logs')"></span>
                    <template x-if="issue.members.length > 1">
                      <span class="text-[9px] text-neutral-600" x-text="issue.members.length + ' members'"></span>
                    </template>
                  </div>

                  <p class="text-[10px] text-neutral-400" x-text="issue.detail"></p>

                  <template x-if="issue.suggested">
                    <div class="flex items-center gap-2 pt-1">
                      <img loading="lazy" decoding="async" :src="issue.suggested.poster_path ? 'https://image.tmdb.org/t/p/w200' + issue.suggested.poster_path : POSTER_FALLBACK" class="w-6 h-9 object-cover rounded flex-shrink-0">
                      <span class="text-[10px] text-emerald-400 truncate">
                        <template x-if="issue.fixKind === 'year'">
                          <span>Set the year to <strong x-text="issue.suggested.year"></strong> so it stops splitting in two</span>
                        </template>
                        <template x-if="issue.fixKind !== 'year'">
                          <span>Should be <strong x-text="issue.suggested.title"></strong>
                            <span x-text="issue.suggested.year ? '(' + issue.suggested.year + ')' : ''"></span></span>
                        </template>
                      </span>
                    </div>
                  </template>
                  <template x-if="!issue.suggested && !issueVerified">
                    <p class="text-[10px] text-sky-400/70 italic pt-0.5">Not checked against TMDB yet — hit Verify above and most of these resolve themselves.</p>
                  </template>
                  <template x-if="!issue.suggested && issueVerified">
                    <p class="text-[10px] text-neutral-600 italic pt-0.5">No confident replacement found — fix this one by hand.</p>
                  </template>

                  <template x-if="issue.suggested && issue.lists && issue.lists.length > 0">
                    <div class="pt-1.5 mt-1 border-t border-neutral-800/60 space-y-1">
                      <p class="text-[9px] uppercase tracking-wider text-neutral-500">
                        Also sitting in <span x-text="issue.lists.length"></span>
                        list<span x-show="issue.lists.length !== 1">s</span> —
                        <span x-text="listRefsSelected(issue)"></span> will be updated
                      </p>
                      <template x-for="ref in issue.lists" :key="ref.id">
                        <div class="flex items-center gap-2 text-[10px] flex-wrap">
                          <input type="checkbox" x-model="ref.selected" class="accent-sky-500 rounded flex-shrink-0">
                          <span class="text-neutral-300 truncate max-w-[10rem]" x-text="ref.title"></span>
                          <span class="text-neutral-600" x-text="ref.owned ? 'yours' : 'by ' + ref.username"></span>
                          <span class="text-neutral-600" x-show="ref.indices.length > 1" x-text="'×' + ref.indices.length"></span>
                          <template x-if="ref.needsRetitle">
                            <span class="flex items-center gap-1 ml-auto">
                              <input type="checkbox" x-model="ref.retitle" class="accent-amber-500 rounded flex-shrink-0">
                              <span class="text-amber-400/80">also retitle &ldquo;<span x-text="ref.entryTitle"></span>&rdquo;</span>
                            </span>
                          </template>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>

                <div class="flex flex-col items-end gap-1 flex-shrink-0">
                  <button @click="fixIssueManually(issue)" title="Search TMDB and relink by hand"
                    class="text-[10px] text-neutral-400 hover:text-sky-400 font-bold px-2 py-1">Fix manually</button>
                  <button @click="dismissIssue(issue)" title="Stop reporting this film"
                    class="text-[10px] text-neutral-600 hover:text-neutral-300 font-bold px-2 py-1">Ignore</button>
                </div>
              </div>
            </template>
          </div>

          <button @click="applyIssueFixes()" :disabled="issueFixBusy || selectedIssueCount() === 0"
            class="w-full bg-amber-500 hover:bg-amber-400 text-neutral-950 font-bold py-3 rounded-xl transition-colors text-sm disabled:opacity-50">
            <span x-show="!issueFixBusy">Repair <span x-text="selectedIssueCount()"></span> selected</span>
            <span x-show="issueFixBusy">Repairing...</span>
          </button>
          <p class="text-[10px] text-neutral-500 text-center">
            Repairing updates every log of that film, for every member, plus any list entries you tick above.
            Ratings, reviews and club picks are untouched.
          </p>
        </div>
      </template>
    </div>
  </div>
  </template>

  // Registered only over https (or localhost), so opening the file directly
  // from disk stays harmless.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        // A new build is only useful if members actually land on it.
        reg.addEventListener('updatefound', () => {
          const sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', () => {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              if (confirm('A new version of Di Maria Jawns is ready. Reload now?')) location.reload();
            }
          });
        });
      }).catch((e) => console.warn('Service worker registration failed:', e));
    });
  }
</script>

      // Call after ANY write to logs / comments / profiles / lists / watchlist.
      _touch() {
        _memo.clear();
        _idx = null;

      // One pass over each table builds every lookup the UI needs.
      // Replaces dozens of repeated .filter() scans per render.
      _indexes() {
        const v = this.dataVersion;
        if (_idx && _idxVersion === v) return _idx;

        const commentsByLog = new Map();
        for (const c of this.comments) {
          const k = String(c.log_id);
          let a = commentsByLog.get(k);
          if (!a) { a = []; commentsByLog.set(k, a); }
          a.push(c);
        }

        const profileByName = new Map();
        for (const pr of this.profiles) {
          if (pr && pr.username) profileByName.set(pr.username.trim().toLowerCase(), pr);
        }

        const logsByUser = new Map();
        const logsByDate = new Map();
        const logsByTmdb = new Map();
        const logsByTitle = new Map();
        for (const l of this.logs) {
          const u = (l.username || 'Anonymous').trim().toLowerCase();
          let a = logsByUser.get(u);
          if (!a) { a = []; logsByUser.set(u, a); }
          a.push(l);

          if (l.created_at) {
            const d = String(l.created_at).substring(0, 10);
            let g = logsByDate.get(d);
            if (!g) { g = []; logsByDate.set(d, g); }
            g.push(l);
          }

          if (l.tmdb_id) {
            const k = String(l.tmdb_id);
            let b = logsByTmdb.get(k);
            if (!b) { b = []; logsByTmdb.set(k, b); }
            b.push(l);
          }
          if (l.movie_title) {
            const k = this._normTitle(l.movie_title);
            let b = logsByTitle.get(k);
            if (!b) { b = []; logsByTitle.set(k, b); }
            b.push(l);
          }
        }

        const wlByUser = new Map();
        for (const w of this.watchlist) {
          const u = (w.username || '').trim().toLowerCase();
          let a = wlByUser.get(u);
          if (!a) { a = []; wlByUser.set(u, a); }
          a.push(w);
        }

        _idx = { commentsByLog, profileByName, logsByUser, logsByDate, logsByTmdb, logsByTitle, wlByUser };
        _idxVersion = v;
        return _idx;
      },

      // Single source of truth for decade bucketing (was copy-pasted 3x).
      _decadeOf(rawYear) {
        const yr = parseInt(rawYear, 10);
        if (!yr) return null;
        if (yr >= 2020) return '2020s';
        if (yr < 1900) return null;
        return String(Math.floor(yr / 10) * 10) + 's';

      filteredLogsPaged() { return this.filteredLogs().slice(0, this.feedLimit); },
      getFilteredMemberLogsPaged(u) { return this.getFilteredMemberLogs(u).slice(0, this.profLogLimit); },
      getFilteredWatchlistPaged(u) { return this.getFilteredWatchlist(u).slice(0, this.wlLimit); },

      async initApp() {
        const client = getDb();
        try {
          if (client) {
            const { data: { session } } = await client.auth.getSession();
            if (session) {
              this.authenticated = true;
              this.username = session.user.user_metadata?.username || localStorage.getItem('jawn_user') || session.user.email.split('@')[0];
              this.activeMemberProfile = this.username;
              await this.loadAll();
              // Metadata backfill used to run synchronously on every single
              // sign-in: 2 TMDB calls + 1 UPDATE per film, sequentially, with
              // a 120ms sleep between each. On a large library that is ten
              // minutes of blocking network chatter before the app settles.
              // Now it waits for the browser to be idle and is capped.
              this.scheduleIdle(() => this.enrichMissingMetadata(false));
            }
          }
        } finally {
          this.isBooting = false;
        }
      },

      scheduleIdle(fn) {
        if (typeof requestIdleCallback === 'function') requestIdleCallback(fn, { timeout: 4000 });
        else setTimeout(fn, 1200);

          this.fetchLogs(),
          this.fetchComments(),
          this.fetchProfiles(),
          this.fetchLists(),
          this.fetchWatchlist(),

      async login() {
        if (!this.inputUsername.trim() || !this.inputPassword) {
          this.errorMessage = 'Enter your handle and password.';
          return;
        }
        if (this.authLoading) return;
        const client = getDb();
        if (!client) { this.errorMessage = 'Cannot reach the server. Try again in a moment.'; return; }

        this.authLoading = true;
        const { data, error } = await client.auth.signInWithPassword({
          email: this.formatEmail(this.inputUsername),
          password: this.inputPassword
        });

        this.authLoading = false;
        if (error) { this.errorMessage = 'Invalid credentials!'; return; }
        this.inputPassword = '';
        this.inputCode = '';
        this.username = data.user.user_metadata?.username || this.inputUsername.trim();
        this.activeMemberProfile = this.username;
        this.authenticated = true;
        localStorage.setItem('jawn_user', this.username);
        await this.loadAll();
        this.scheduleIdle(() => this.enrichMissingMetadata(false));
      },

      // Restored from the earlier build's handleSignUp(), mapped onto this
      // version's field names (inputUsername / inputPassword / inputCode).
      async signUp() {
        this.errorMessage = '';
        if (this.authLoading) return;

        const handle = this.inputUsername.trim();
        if (!handle || !this.inputPassword || !this.inputCode.trim()) {
          this.errorMessage = 'All fields are required.';
          return;
        }
        if (this.inputCode.trim() !== INVITE_CODE) {
          this.errorMessage = 'Invalid invite code.';
          return;
        }
        if (this.inputPassword.length < 6) {
          this.errorMessage = 'Password must be at least 6 characters.';
          return;
        }

        const client = getDb();
        if (!client) { this.errorMessage = 'Cannot reach the server. Try again in a moment.'; return; }

        this.authLoading = true;
        const { data, error } = await client.auth.signUp({
          email: this.formatEmail(handle),
          password: this.inputPassword,
          options: { data: { username: handle } }
        });
        this.authLoading = false;

        if (error) { this.errorMessage = error.message; return; }

        // With a synthetic @dimaria.internal address no confirmation mail can
        // ever be delivered, so surface that clearly instead of failing quietly.
        if (!data.session) {
          this.errorMessage = 'Account created, but email confirmation is switched on in Supabase. Turn off "Confirm email" under Authentication > Providers, then sign in.';
          this.authMode = 'login';
          return;
        }

        this.errorMessage = '';
        await this.login();
      },

      async logout() {
        const client = getDb();
        if (client) await client.auth.signOut();
        this.authenticated = false;
        // Release the cached tables so a signed-out tab is not holding

        this.username = '';
        this.activeMemberProfile = '';
        this.inputPassword = '';
        this.logs = []; this.comments = []; this.watchlist = []; this.lists = []; this.profiles = [];
        this.feedLimit = 30; this.profLogLimit = 40; this.wlLimit = 50;

      // Generic paged reader. Supabase caps a single select at 1000 rows,
      // so comments / profiles / lists were being silently truncated.
      // First page is fetched, then any remaining pages go out in parallel.
      async fetchAllRows(table, orderCol, ascending) {
        const client = getDb();
        if (!client) return null;
        const PAGE = 1000;
        const q = () => {
          let b = client.from(table).select('*', { count: 'exact' });
          if (orderCol) b = b.order(orderCol, { ascending: !!ascending });
          return b;
        };
        const first = await q().range(0, PAGE - 1);
        if (first.error || !first.data) return null;
        const total = first.count != null ? first.count : first.data.length;
        if (total <= PAGE) return first.data;

        const pages = Math.ceil(total / PAGE) - 1;
        const rest = await Promise.all(
          Array.from({ length: pages }, (_, i) =>
            q().range((i + 1) * PAGE, (i + 2) * PAGE - 1).then(r => r.data || [])
          )
        );
        return first.data.concat(...rest);
      },

      async saveAnnouncement() {

        this.announcementError = '';
        const title = (this.announcementForm.title || '').trim();
        const body = (this.announcementForm.body || '').trim();
        if (!title) { this.announcementError = 'Give it a title.'; return; }

        const client = getDb();

        const row = { username: this.username, title, body, pinned: !!this.announcementForm.pinned };
        this.announcementBusy = true;
        const { error } = this.editingAnnouncementId
          ? await client.from('announcements').update(row).eq('id', this.editingAnnouncementId)
          : await client.from('announcements').insert([row]);
        this.announcementBusy = false;

        if (error) {
          const msg = error.message || 'Unknown error';
          this.announcementError = /relation|does not exist|schema cache|find the table/i.test(msg)
            ? 'The announcements table does not exist yet. Run the setup SQL first.'
            : (/policy|permission|denied|row-level/i.test(msg)
              ? `Supabase rejected the write: ${msg}`
              : `Could not save: ${msg}`);
          console.error('[announcement save]', error);
          return;
        }

        await this.fetchAnnouncements();
        this.showAnnouncementModal = false;

      handleZipDrop(e) {
