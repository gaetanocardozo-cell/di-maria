      // Chunked bulk insert with a little overlap. 50-row sequential
      // chunks meant a 2,000 row diary was 40 blocking round trips.
      async bulkInsert(table, rows, label) {
        const client = getDb();
        if (!client || !rows.length) return 0;
        const SIZE = 250;
        const chunks = [];
        for (let i = 0; i < rows.length; i += SIZE) chunks.push(rows.slice(i, i + SIZE));
        let inserted = 0;
        let failed = 0;
        await pool(chunks, 3, async (chunk) => {
          const { error } = await client.from(table).insert(chunk);
          if (error) { failed += chunk.length; console.error('[import]', table, error.message); }
          else inserted += chunk.length;
          this.importProgressText = `Imported ${inserted} of ${rows.length} ${label}...`;
        });
        if (failed) this.importProgressText = `Imported ${inserted} of ${rows.length} ${label} (${failed} rejected — check console).`;
        return inserted;
      },

      // ================= LETTERBOXD IMPORT (rewritten) =================
      // Letterboxd spreads one film across up to four files:
      //   diary.csv    one row per viewing, with the watched date + rating
      //   ratings.csv  every rating you have ever given (repeats the diary)
      //   watched.csv  every film ever marked seen (superset of the diary)
      //   reviews.csv  the actual review text, keyed by film + watched date
      // The previous importer read three of them independently and inserted
      // from each, so any film present in diary + ratings + watched landed
      // three times. reviews.csv was never opened at all, which is why no
      // review text ever arrived; the `review` column was instead filled
      // with the literal string 'Imported from Letterboxd' for rewatches.
      //
      // This version parses everything first, merges it into one entry per
      // real viewing, checks against what is already in the database, and
      // only then writes.

      _lbNorm(t) { return (t || '').toString().trim().toLowerCase().replace(/\s+/g, ' '); },
      _lbKey(title, year) { return this._lbNorm(title) + '|' + (year == null ? '' : String(year).trim()); },

      // Anchor imported dates at midday UTC. '2024-03-15' parses as UTC
      // midnight, which toLocaleDateString then renders as 14 March for
      // anyone west of Greenwich, so every imported log showed a day early.
      _lbDate(v) {
        if (!v) return null;
        const str = String(v).trim();
        const m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
        if (m) {
          const mm = m[2].padStart(2, '0'), dd = m[3].padStart(2, '0');
          return `${m[1]}-${mm}-${dd}T12:00:00.000Z`;
        }
        const d = new Date(str);
        return isNaN(d.getTime()) ? null : d.toISOString();
      },

      _lbRating(v) {
        if (v === undefined || v === null || String(v).trim() === '') return null;
        const n = parseFloat(v);
        return isNaN(n) ? null : n;
      },

      _lbBool(v) { return v === true || /^(yes|true|1)$/i.test(String(v == null ? '' : v).trim()); },

      // Column names have shifted across Letterboxd export versions, so
      // accept the known aliases rather than hard-coding one spelling.
      _lbField(row, names) {
        for (const n of names) {
          if (row[n] !== undefined && row[n] !== null && String(row[n]).trim() !== '') return row[n];
        }
        return '';
      },

      async _lbRead(zip, base) {
        // CSVs sometimes sit one folder deep inside the archive.
        const hits = zip.file(new RegExp('(^|/)' + base + '\\.csv$', 'i'));
        if (!hits || !hits.length) return null;
        let text = await hits[0].async('string');
        if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
        const parsed = Papa.parse(text, {
          header: true,
          skipEmptyLines: 'greedy',
          transformHeader: h => String(h).replace(/^\uFEFF/, '').trim()
        });
        return parsed.data || [];
      },

      async processZipFile(file) {
        if (!file || !/\.zip$/i.test(file.name)) {
          alert('Please select or drop a valid Letterboxd export .zip file!');
          return;
        }

        this.importReport = null;
        this.importStatus = 'Reading ZIP File...';
        this.importProgressText = 'Unzipping contents...';

        try {
          const zip = await new JSZip().loadAsync(file);
          const client = getDb();
          if (!client) { alert('Supabase client unavailable!'); return; }

          this.importStatus = 'Parsing CSV files...';
          const [diary, ratings, watched, reviews, wlRows] = await Promise.all([
            this.importOpts.diary     ? this._lbRead(zip, 'diary')     : null,
            this.importOpts.ratings   ? this._lbRead(zip, 'ratings')   : null,
            this.importOpts.watched   ? this._lbRead(zip, 'watched')   : null,
            this.importOpts.reviews   ? this._lbRead(zip, 'reviews')   : null,
            this.importOpts.watchlist ? this._lbRead(zip, 'watchlist') : null
          ]);

          const filesFound = [];
          if (diary)   filesFound.push(`diary ${diary.length}`);
          if (ratings) filesFound.push(`ratings ${ratings.length}`);
          if (watched) filesFound.push(`watched ${watched.length}`);
          if (reviews) filesFound.push(`reviews ${reviews.length}`);
          if (wlRows)  filesFound.push(`watchlist ${wlRows.length}`);
          this.importProgressText = 'Found ' + (filesFound.join(', ') || 'nothing to import');

          const NAME = ['Name', 'Title', 'Film', 'Film Name'];
          const YEAR = ['Year', 'Release Year', 'Film Year'];
          const WATCHED_DATE = ['Watched Date', 'WatchedDate', 'Date Watched'];
          const REVIEW = ['Review', 'Review Text', 'Notes'];

          // ---- merge every source into one entry per viewing ----------
          const entries = new Map();   // "film|year@yyyy-mm-dd" -> entry
          const byFilm = new Map();    // "film|year"            -> entry[]

          const put = (title, year, dateISO, patch) => {
            const fKey = this._lbKey(title, year);
            const dKey = dateISO ? dateISO.substring(0, 10) : 'nodate';
            const key = fKey + '@' + dKey;
            let e = entries.get(key);
            if (!e) {
              e = {
                fKey, dKey,
                title: String(title).trim(),
                year: year == null ? '' : String(year).trim(),
                created_at: dateISO,
                rating: null,
                review: '',
                is_rewatch: false
              };
              entries.set(key, e);
              let bucket = byFilm.get(fKey);
              if (!bucket) { bucket = []; byFilm.set(fKey, bucket); }
              bucket.push(e);
            }
            if (patch.rating !== null && patch.rating !== undefined && e.rating === null) e.rating = patch.rating;
            if (patch.review && !e.review) e.review = patch.review;
            if (patch.is_rewatch) e.is_rewatch = true;
            if (!e.created_at && dateISO) { e.created_at = dateISO; }
            return e;
          };

          // 1. diary.csv defines the real viewings
          for (const r of (diary || [])) {
            const name = this._lbField(r, NAME);
            if (!name) continue;
            put(name, this._lbField(r, YEAR),
                this._lbDate(this._lbField(r, WATCHED_DATE) || this._lbField(r, ['Date'])),
                { rating: this._lbRating(this._lbField(r, ['Rating'])),
                  is_rewatch: this._lbBool(this._lbField(r, ['Rewatch'])) });
          }

          // 2. reviews.csv carries the text and shares the diary's watched
          //    date, so it lands on the matching entry instead of a new row
          let reviewsAttached = 0;
          for (const r of (reviews || [])) {
            const name = this._lbField(r, NAME);
            if (!name) continue;
            const text = this._lbField(r, REVIEW);
            const e = put(name, this._lbField(r, YEAR),
                this._lbDate(this._lbField(r, WATCHED_DATE) || this._lbField(r, ['Date'])),
                { rating: this._lbRating(this._lbField(r, ['Rating'])),
                  review: text,
                  is_rewatch: this._lbBool(this._lbField(r, ['Rewatch'])) });
            if (text && e.review === text) reviewsAttached++;
          }

          // 3. ratings.csv only fills gaps; it never creates a second row
          //    for a film the diary already covered
          for (const r of (ratings || [])) {
            const name = this._lbField(r, NAME);
            if (!name) continue;
            const year = this._lbField(r, YEAR);
            const rating = this._lbRating(this._lbField(r, ['Rating']));
            const bucket = byFilm.get(this._lbKey(name, year));
            if (bucket && bucket.length) {
              for (const e of bucket) if (e.rating === null) e.rating = rating;
            } else {
              put(name, year, this._lbDate(this._lbField(r, ['Date'])), { rating });
            }
          }

          // 4. watched.csv is the catch-all for films with no diary entry
          for (const r of (watched || [])) {
            const name = this._lbField(r, NAME);
            if (!name) continue;
            const year = this._lbField(r, YEAR);
            if (byFilm.has(this._lbKey(name, year))) continue;
            put(name, year, this._lbDate(this._lbField(r, ['Date'])), {});
          }

          // ---- skip whatever is already in the database ---------------
          const mine = this._indexes().logsByUser.get((this.username || '').trim().toLowerCase()) || [];
          const existingByViewing = new Map();
          const existingByFilm = new Map();
          for (const l of mine) {
            const fk = this._lbKey(l.movie_title, l.release_year);
            const dk = l.created_at ? String(l.created_at).substring(0, 10) : 'nodate';
            if (!existingByViewing.has(fk + '@' + dk)) existingByViewing.set(fk + '@' + dk, l);
            let b = existingByFilm.get(fk);
            if (!b) { b = []; existingByFilm.set(fk, b); }
            b.push(l);
          }

          const toInsert = [];
          const toUpdate = [];
          let skipped = 0;

          for (const e of entries.values()) {
            const match = this.dupeMode === 'film'
              ? (existingByFilm.get(e.fKey) || [])[0]
              : existingByViewing.get(e.fKey + '@' + e.dKey);

            if (match) {
              skipped++;
              // Backfill mode: push review text and ratings onto logs that
              // are already there but were imported without them.
              if (this.importOpts.overwrite) {
                const patch = {};
                if (e.review && e.review !== match.review) patch.review = e.review;
                if (e.rating !== null && Number(match.rating) !== Number(e.rating)) patch.rating = e.rating;
                if (e.is_rewatch && !match.is_rewatch) patch.is_rewatch = true;
                if (Object.keys(patch).length) toUpdate.push({ id: match.id, patch });
              }
              continue;
            }

            toInsert.push({
              username: this.username,
              movie_title: e.title,
              release_year: e.year,
              rating: e.rating,
              review: e.review || '',
              is_rewatch: e.is_rewatch,
              created_at: e.created_at || new Date().toISOString()
            });
          }

          this.importStatus = 'Writing to database...';
          const insertedLogs = await this.bulkInsert('logs', toInsert, 'logs');

          let updated = 0;
          if (toUpdate.length) {
            this.importProgressText = `Updating ${toUpdate.length} existing logs...`;
            await pool(toUpdate, 6, async (u) => {
              const { error } = await client.from('logs').update(u.patch).eq('id', u.id);
              if (!error) updated++;
            });
          }

          // ---- watchlist ----------------------------------------------
          let insertedWl = 0;
          let skippedWl = 0;
          if (wlRows) {
            const existingWl = new Set(
              (this._indexes().wlByUser.get((this.username || '').trim().toLowerCase()) || [])
                .map(w => this._lbKey(w.movie_title, w.release_year))
            );
            const seen = new Set();
            const newWl = [];
            for (const r of wlRows) {
              const name = this._lbField(r, NAME);
              if (!name) continue;
              const year = this._lbField(r, YEAR);
              const k = this._lbKey(name, year);
              if (existingWl.has(k) || seen.has(k)) { skippedWl++; continue; }
              seen.add(k);
              newWl.push({
                username: this.username,
                movie_title: String(name).trim(),
                release_year: year == null ? '' : String(year).trim(),
                created_at: this._lbDate(this._lbField(r, ['Date'])) || new Date().toISOString()
              });
            }
            insertedWl = await this.bulkInsert('watchlist', newWl, 'watchlist items');
          }

          this.importReport = {
            viewings: entries.size,
            inserted: insertedLogs,
            skipped,
            updated,
            reviews: reviewsAttached,
            watchlistAdded: insertedWl,
            watchlistSkipped: skippedWl,
            files: filesFound.join(', ') || 'none'
          };
          this.importStatus = '✅ Import Complete!';
          this.importProgressText = `${insertedLogs} added, ${skipped} already present, ${reviewsAttached} reviews matched.`;

          await Promise.all([this.fetchLogs(), this.fetchWatchlist()]);
          this.scheduleIdle(() => this.enrichMissingMetadata(false));

        } catch (err) {
          console.error('Error importing ZIP:', err);
          this.importStatus = '❌ Import Failed';
          this.importProgressText = err.message || 'An error occurred while parsing the ZIP file.';
        }
      },

      // ================= DUPLICATE CLEANUP =================
      // Repairs libraries that the old importer already tripled up.
      // Scans, reports, and only deletes on explicit confirmation.
      _dupeGroups() {
        const mine = this._indexes().logsByUser.get((this.username || '').trim().toLowerCase()) || [];
        const groups = new Map();
        for (const l of mine) {
          const fk = this._lbKey(l.movie_title, l.release_year);
          const dk = l.created_at ? String(l.created_at).substring(0, 10) : 'nodate';
          const key = this.dupeMode === 'film' ? fk : fk + '@' + dk;
          let g = groups.get(key);
          if (!g) { g = []; groups.set(key, g); }
          g.push(l);
        }
        return groups;
      },

      // Highest score wins and is kept: a written review beats a bare
      // rating, a rating beats nothing, then oldest row wins.
      _logScore(l) {
        let sc = 0;
        if (l.review && l.review.trim() && l.review.trim() !== 'Imported from Letterboxd') sc += 1000;
        if (l.rating !== null && l.rating !== undefined) sc += 100;
        if (l.poster_path) sc += 10;
        if (l.director) sc += 5;
        if (l.stills && l.stills.length) sc += 5;
        if (l.is_club_pick) sc += 10000;
        return sc;
      },

      scanForDuplicates() {
        this.isScanningDupes = true;
        const groups = this._dupeGroups();
        const victims = [];
        const sample = [];
        for (const [, g] of groups) {
          if (g.length < 2) continue;
          const sorted = [...g].sort((a, b) =>
            this._logScore(b) - this._logScore(a) ||
            (Date.parse(a.created_at) || 0) - (Date.parse(b.created_at) || 0) ||
            String(a.id).localeCompare(String(b.id))
          );
          const keep = sorted[0];
          for (const l of sorted.slice(1)) victims.push(l);
          if (sample.length < 8) {
            sample.push({
              title: keep.movie_title,
              year: keep.release_year || '',
              copies: g.length,
              keeping: keep.review && keep.review.trim() ? 'the one with a review'
                     : (keep.rating != null ? 'the rated one' : 'the oldest')
            });
          }
        }
        this.dupeReport = { affected: victims.length, films: sample.length, sample, ids: victims.map(v => v.id) };
        this.isScanningDupes = false;
      },

      async deleteDuplicates() {
        if (!this.dupeReport || !this.dupeReport.ids.length) return;
        const n = this.dupeReport.ids.length;
        if (!confirm(`Permanently delete ${n} duplicate log${n === 1 ? '' : 's'}? The best copy of each film is kept. This cannot be undone.`)) return;
        const client = getDb();
        if (!client) return;
        this.isScanningDupes = true;
        this.importStatus = 'Removing duplicates...';
        const ids = this.dupeReport.ids;
        let removed = 0;
        const chunks = [];
        for (let i = 0; i < ids.length; i += 100) chunks.push(ids.slice(i, i + 100));
        await pool(chunks, 3, async (chunk) => {
          const { error } = await client.from('logs').delete().in('id', chunk);
          if (!error) removed += chunk.length;
          else console.error('[dedupe]', error.message);
          this.importProgressText = `Removed ${removed} of ${ids.length}...`;
        });
        await this.fetchLogs();
        this.dupeReport = null;
        this.isScanningDupes = false;
        this.importStatus = `✅ Removed ${removed} duplicate logs.`;
        this.importProgressText = '';
      },

      // ADD & REMOVE WATCHLIST
      async addToWatchlist(item) {
        const client = getDb();
        if (!client) return;
        const title = item.movie_title || item.title;
        const tmdbId = item.tmdb_id || item.id;
        const poster = item.poster_path;
        const year = item.release_year || (item.release_date ? item.release_date.substring(0,4) : '');

        const exists = this.watchlist.some(w => 
          (w.username || '').trim().toLowerCase() === this.username.trim().toLowerCase() && 
          (String(w.tmdb_id) === String(tmdbId) || w.movie_title.toLowerCase() === title.toLowerCase())
        );
        if (exists) { alert('Already in your watchlist!'); return; }

        const { data, error } = await client.from('watchlist').insert([{
          username: this.username,
          movie_title: title,
          poster_path: poster,
          tmdb_id: String(tmdbId || ''),
          release_year: year
        }]).select();

        if (error) alert('Error adding to watchlist: ' + error.message);
        else {
          if (data) this.watchlist.push(data[0]);
          this._touch();
          alert(`Added "${title}" to your Watchlist!`);
        }
      },

      async removeFromWatchlist(id) {
        const client = getDb();
        if (!client) return;
        await client.from('watchlist').delete().eq('id', id);
        this.watchlist = this.watchlist.filter(w => w.id !== id);
        this._touch();
      },

      // WATCHLIST FILTERING, SORTING & SHUFFLE LOGIC
      shuffleWatchlist() {
        this.wlShuffleSeed++;
        this.wlSortBy = 'shuffle';
      },

      getFilteredWatchlist(targetUsername) {
        if (!targetUsername || !this.watchlist) return EMPTY;
        const key = `wl|${targetUsername}|${this.wlFilterDecade}|${this.wlSortBy}|${this.wlShuffleSeed}|${this.dataVersion}`;
        return memo(key, () => {
          const idx = this._indexes();
          let list = idx.wlByUser.get(targetUsername.trim().toLowerCase()) || [];

          if (this.wlFilterDecade !== 'ALL') {
            list = list.filter(w => this._decadeOf(w.release_year) === this.wlFilterDecade);
          }

          // Club average, resolved through the prebuilt indexes rather
          // than rescanning every log for every watchlist row.
          list = list.map(item => {
            const seen = new Set();
            if (item.tmdb_id) {
              for (const l of (idx.logsByTmdb.get(String(item.tmdb_id)) || [])) seen.add(l);
            }
            if (item.movie_title) {
              for (const l of (idx.logsByTitle.get(this._normTitle(item.movie_title)) || [])) seen.add(l);
            }
            const perMember = this._ratingsOnePerMember([...seen]);
            const avg = perMember.length ? perMember.reduce((a, b) => a + b, 0) / perMember.length : 0;
            return { ...item, clubAvgNum: avg, clubAvgRating: perMember.length ? avg.toFixed(1) : 'N/A' };
          });

          if (this.wlSortBy === 'club_rating_desc') {
            list.sort((a, b) => b.clubAvgNum - a.clubAvgNum);
          } else if (this.wlSortBy === 'club_rating_asc') {
            list.sort((a, b) => a.clubAvgNum - b.clubAvgNum);
          } else if (this.wlSortBy === 'alpha') {
            list.sort((a, b) => (a.movie_title || '').localeCompare(b.movie_title || ''));
          } else if (this.wlSortBy === 'shuffle') {
            return seededShuffle(list, this.wlShuffleSeed);
          } else {
            const keyed = list.map(w => [Date.parse(w.created_at) || 0, w]);
            keyed.sort((a, b) => b[0] - a[0]);
            list = keyed.map(([, w]) => w);
          }
          return list;
        });
      },

      // REVIEW TRUNCATION HELPERS
      getFirstParagraph(text, limit = 180) {
        if (!text) return '';
        let lines = text.split('\n');
        let firstPara = lines[0].trim();
        if (firstPara.length > limit) {
          return firstPara.substring(0, limit).trim() + '...';
        }
        if (lines.length > 1 && firstPara.length <= limit) {
          return firstPara + '...';
        }
        return firstPara;
      },

      isReviewLong(log) {
        if (!log) return false;
        const text = log.review || '';
        const lines = text.split('\n');
        const hasStills = log.stills && log.stills.length > 0;
        return text.length > 180 || lines.length > 1 || hasStills;
      },

      // PERSONAL LOG HISTORY FILTERING LOGIC
      getFilteredMemberLogs(targetUsername) {
        if (!targetUsername || !this.logs) return EMPTY;
        const key = `fml|${targetUsername}|${this.profFilterRating}|${this.profFilterDecade}|${this.profFilterSearch}|${this.dataVersion}`;
        return memo(key, () => {
          let list = this._indexes().logsByUser.get(targetUsername.trim().toLowerCase()) || [];

          if (this.profFilterRating !== 'ALL') {
            if (this.profFilterRating === 'UNRATED') {
              list = list.filter(l => l.rating === null || l.rating === undefined);
            } else if (this.profFilterRating === '2.5') {
              list = list.filter(l => l.rating !== null && Number(l.rating) <= 2.5);
            } else {
              const target = parseFloat(this.profFilterRating);
              list = list.filter(l => l.rating !== null && Number(l.rating) === target);
            }
          }

          if (this.profFilterDecade !== 'ALL') {
            list = list.filter(l => this._decadeOf(l.release_year) === this.profFilterDecade);
          }

          if (this.profFilterSearch.trim()) {
            const q = this.profFilterSearch.trim().toLowerCase();
            list = list.filter(l => (l.movie_title || '').toLowerCase().includes(q) || (l.review || '').toLowerCase().includes(q));
          }

          return list;
        });
      },

      getUniqueUserLogs() {
        if (!this.logs) return EMPTY;
        return memo(`uul|${this.dataVersion}`, () => {
          const map = new Map();
          // Parse each timestamp once instead of allocating two Date objects
          // per comparison (that alone was ~90ms on a 4k-row library).
          const keyed = this.logs.map(l => [Date.parse(l.created_at) || 0, l]);
          keyed.sort((a, b) => a[0] - b[0]);
          keyed.forEach(([, l]) => {
            const user = (l.username || 'Anonymous').trim().toLowerCase();
            const movieKey = (l.tmdb_id || l.movie_title || '').trim().toLowerCase();
            if (user && movieKey) map.set(`${user}:::${movieKey}`, l);
          });
          return Array.from(map.values());
        });
      },

      // Averaging every log double-counts anyone who rewatched: three
      // viewings of a film by one member pulled the club average three
      // times. One member, one rating, always their most recent.
      _ratingsOnePerMember(logs) {
        return this.getLatestClubReviews(logs)
          .filter(l => l.rating !== null && l.rating !== undefined && !isNaN(l.rating))
          .map(l => Number(l.rating));
      },

      _averageOf(nums, digits = 1) {
        if (!nums.length) return null;
        return (nums.reduce((a, b) => a + b, 0) / nums.length).toFixed(digits);
      },

      getLatestClubReviews(reviews) {
        if (!reviews) return EMPTY;
        const hit = _latestReviewCache.get(reviews);
        if (hit) return hit;
        const userLatestMap = new Map();
        const keyed = reviews.map(r => [Date.parse(r.created_at) || 0, r]);
        keyed.sort((a, b) => a[0] - b[0]);
        keyed.forEach(([, r]) => {
          const user = (r.username || 'Anonymous').trim().toLowerCase();
          userLatestMap.set(user, r);
        });
        const out = Array.from(userLatestMap.values());
        _latestReviewCache.set(reviews, out);
        return out;
      },

      getOverallSiteAverage() {
        return memo(`avg|${this.dataVersion}`, () => this._overallSiteAverage());
      },
      _overallSiteAverage() {
        const uniqueLogs = this.getUniqueUserLogs();
        const rated = uniqueLogs.filter(l => l.rating !== null && !isNaN(l.rating));
        if (!rated.length) return '0.0';
        return (rated.reduce((sum, l) => sum + Number(l.rating), 0) / rated.length).toFixed(1);
      },

      getTop20Films() {
        return memo(`t20f|${this.dataVersion}`, () => this._top20Films());
      },
      _top20Films() {
        const uniqueLogs = this.getUniqueUserLogs();
        const groups = {};
        uniqueLogs.forEach(log => {
          const key = log.tmdb_id || log.movie_title;
          if (!key) return;
          if (!groups[key]) groups[key] = { tmdb_id: log.tmdb_id, movie_title: log.movie_title, poster_path: log.poster_path, count: 0, ratedCount: 0, ratingsSum: 0 };
          groups[key].count++;
          if (log.rating !== null && !isNaN(log.rating)) {
            groups[key].ratedCount++;
            groups[key].ratingsSum += Number(log.rating);
          }
        });
        return Object.values(groups)
          .map(g => ({ ...g, avgRating: g.ratedCount ? (g.ratingsSum / g.ratedCount).toFixed(1) : '0.0' }))
          .sort((a, b) => b.avgRating - a.avgRating || b.count - a.count)
          .slice(0, 20);
      },

      // Shown when the chart is thin, so an empty leaderboard reads as
      // "not enough data yet" rather than as a bug.
      directorsBelowThreshold() {
        return memo(`dirshort|${this.dataVersion}`, () => {
          const groups = {};
          for (const log of this.getUniqueUserLogs()) {
            if (!log.director || !log.director.trim()) continue;
            if (log.rating === null || isNaN(log.rating)) continue;
            const d = log.director.trim();
            groups[d] = (groups[d] || 0) + 1;
          }
          return Object.values(groups).filter(n => n > 0 && n < DIRECTOR_MIN_WATCHES).length;
        });
      },

      getTop20Directors() {
        return memo(`t20d|${this.dataVersion}`, () => this._top20Directors());
      },
      _top20Directors() {
        const uniqueLogs = this.getUniqueUserLogs();
        const dirGroups = {};
        
        uniqueLogs.forEach(log => {
          if (log.director && log.director.trim()) {
            const dir = log.director.trim();
            if (!dirGroups[dir]) dirGroups[dir] = { name: dir, count: 0, ratedCount: 0, ratingsSum: 0 };
            dirGroups[dir].count++;
            if (log.rating !== null && !isNaN(log.rating)) {
              dirGroups[dir].ratedCount++;
              dirGroups[dir].ratingsSum += Number(log.rating);
            }
          }
        });

        // Ranked by how well a director's films actually landed, not by how
        // many the club got through. The threshold matters: without it a
        // director with a single 5.0 tops the chart, so the leaderboard
        // ends up surfacing whoever has been watched least.
        return Object.values(dirGroups)
          .filter(d => d.ratedCount >= DIRECTOR_MIN_WATCHES)
          .map(d => ({ ...d, avg: d.ratingsSum / d.ratedCount, avgRating: (d.ratingsSum / d.ratedCount).toFixed(2) }))
          .sort((a, b) => b.avg - a.avg || b.ratedCount - a.ratedCount || a.name.localeCompare(b.name))
          .slice(0, 20);
      },

      getTop20Performances() {
        return memo(`t20p|${this.dataVersion}`, () => this._top20Performances());
      },
      _top20Performances() {
        if (!this.logs) return EMPTY;
        const perfGroups = {};
        this.logs.forEach(log => {
          if (log.fav_performance && log.fav_performance.trim()) {
            const perf = log.fav_performance.trim();
            if (!perfGroups[perf]) perfGroups[perf] = { name: perf, count: 0 };
            perfGroups[perf].count++;
          }
        });
        return Object.values(perfGroups).sort((a, b) => b.count - a.count).slice(0, 20);
      },

      getCinemaStats() {
        return memo(`cine|${this.dataVersion}`, () => this._cinemaStats());
      },
      _cinemaStats() {
        const unique = this.getUniqueUserLogs();
        const totalMins = unique.length * 110;
        const hours = (totalMins / 60).toFixed(0);
        const days = (totalMins / 1440).toFixed(1);
        return { hours, days };
      },

      getDecadeStats() {
        return memo(`dec|${this.dataVersion}`, () => {
          const unique = this.getUniqueUserLogs();
          const decades = {
            '2020s': 0, '2010s': 0, '2000s': 0, '1990s': 0, '1980s': 0,
            '1970s': 0, '1960s': 0, '1950s': 0, '1940s': 0, '1930s': 0,
            '1920s': 0, '1910s': 0, '1900s': 0
          };
          let totalWithYear = 0;
          for (const l of unique) {
            const d = this._decadeOf(l.release_year);
            if (d && decades[d] !== undefined) { decades[d]++; totalWithYear++; }
          }
          return Object.keys(decades).map(k => ({
            decade: k,
            count: decades[k],
            percent: totalWithYear ? ((decades[k] / totalWithYear) * 100).toFixed(1) : 0
          }));
        });
      },

      _histogram(reviews) {
        if (!reviews || reviews.length === 0) return null;
        let h = _histCache.get(reviews);
        if (h) return h;
        const counts = {};
        for (const b of RATING_BUCKETS) counts[b] = 0;
        for (const r of this.getLatestClubReviews(reviews)) {
          if (r.rating === null || r.rating === undefined) continue;
          const n = Number(r.rating);
          if (counts[n] !== undefined) counts[n]++;
        }
        let max = 1;
        for (const b of RATING_BUCKETS) if (counts[b] > max) max = counts[b];
        h = { counts, max };
        _histCache.set(reviews, h);
        return h;
      },

      getHistogramCount(reviews, ratingVal) {
        const h = this._histogram(reviews);
        return h ? (h.counts[ratingVal] || 0) : 0;
      },

      getHistogramHeight(reviews, ratingVal) {
        const h = this._histogram(reviews);
        if (!h) return 0;
        return (((h.counts[ratingVal] || 0) / h.max) * 100).toFixed(0);
      },

      getSortedClubPicks() {
        return memo(`clubpicks|${this.dataVersion}`, () => this._sortedClubPicks());
      },
      _sortedClubPicks() {
        if (!this.logs) return EMPTY;
        const clubLogs = this.logs.filter(log => log.is_club_pick);
        
        const groups = {};
        clubLogs.forEach(log => {
          const key = log.tmdb_id || log.movie_title;
          if (!groups[key]) groups[key] = { tmdb_id: log.tmdb_id, movie_title: log.movie_title, poster_path: log.poster_path, release_year: log.release_year || '', club_label: log.club_label || '', reviews: [], ratingsSum: 0, ratedCount: 0, perfMap: {} };
          groups[key].reviews.push(log);
          if (log.rating !== null && !isNaN(log.rating)) {
            groups[key].ratedCount++;
            groups[key].ratingsSum += Number(log.rating);
          }
          if (log.fav_performance) {
            const p = log.fav_performance.trim();
            groups[key].perfMap[p] = (groups[key].perfMap[p] || 0) + 1;
          }
        });

        const list = Object.values(groups).map(group => {
          const topPerformances = Object.keys(group.perfMap)
            .map(p => ({ name: p, count: group.perfMap[p] }))
            .sort((a, b) => b.count - a.count)
            .slice(0, 3);

          const perMember = this._ratingsOnePerMember(group.reviews || []);
          return {
            ...group,
            ratedCount: perMember.length,
            avgRating: this._averageOf(perMember) || 'N/A',
            topPerformances: topPerformances
          };
        });

        return list.sort((a, b) => (b.avgRating === 'N/A' ? -1 : b.avgRating) - (a.avgRating === 'N/A' ? -1 : a.avgRating));
      },

      async saveLog() {
        const client = getDb();
        if (!client) return;

        const releaseYear = this.selectedMovie?.release_date ? this.selectedMovie.release_date.substring(0, 4) : '';

        const logPayload = {
          movie_title: this.selectedMovie ? this.selectedMovie.title : '',
          poster_path: this.selectedMovie ? this.selectedMovie.poster_path : '',
          tmdb_id: this.selectedMovie ? String(this.selectedMovie.id || '') : '',
          rating: this.newLog.rating !== null ? Number(this.newLog.rating) : null,
          review: this.newLog.review,
          is_club_pick: Boolean(this.newLog.is_club_pick),
          club_label: this.newLog.is_club_pick ? this.newLog.club_label : '',
          fav_performance: this.newLog.fav_performance,
          director: this.newLog.director,
          is_rewatch: Boolean(this.newLog.is_rewatch),
          stills: this.newLog.stills || [],
          release_year: releaseYear,
          username: this.username || 'Anonymous'
        };
        if (!this.mediaTypeUnsupported && this.selectedMovie && this.selectedMovie.media === 'tv') {
          logPayload.media_type = 'tv';
        }

        const write = (payload) => (this.isEditing && this.editingLogId)
          ? client.from('logs').update(payload).eq('id', this.editingLogId).select()
          : client.from('logs').insert([payload]).select();

        let response = await write(logPayload);
        if (response.error && this._isMissingMediaColumn(response.error)) {
          this.mediaTypeUnsupported = true;
          const { media_type, ...rest } = logPayload;
          response = await write(rest);
        }

        if (response.error) {
          alert('Failed to save log: ' + response.error.message);
        } else {
          this.showLogModal = false;

          if (response.data && response.data.length > 0) {
            const savedItem = { ...response.data[0], stills: response.data[0].stills || [] };
            if (this.isEditing && this.editingLogId) {
              const idx = this.logs.findIndex(l => l.id === this.editingLogId);
              if (idx !== -1) this.logs.splice(idx, 1, savedItem);
            } else {
              this.logs.unshift(savedItem);
            }
            this._touch();
          } else {
            await this.fetchLogs();
          }

          if (this.showMovieDetailsModal && this.selectedMovieDetail) {
            await this.openMovieDetails(this.selectedMovieDetail);
          }
        }
      },

      // Fold the ways the same title gets written down: accents, the
      // vulgar-fraction characters (8½ vs 8 1/2), ampersands, punctuation
      // and spacing. Both collapse to '812' so they compare equal.
      // ================= FILMS AND SERIES =================
      // tmdb_id used to mean "a movie id" everywhere. A series id in the
      // same column 404s every /movie/ call, so rows carry a media_type
      // alongside it. Anything without one is a film, which keeps every
      // existing row working untouched.
      _media(row) {
        return row && String(row.media_type || '').toLowerCase() === 'tv' ? 'tv' : 'movie';
      },

      _tmdbUrl(media, path, params) {
        const base = `https://api.themoviedb.org/3/${media === 'tv' ? 'tv' : 'movie'}${path}`;
        const sep = base.includes('?') ? '&' : '?';
        return `${base}${sep}api_key=${TMDB_API_KEY}${params ? '&' + params : ''}`;
      },

      // TMDB names the same fields differently for series. Fold them into
      // the film shape so every scoring and comparison path stays identical.
      _normTmdbResult(r, media) {
        if (media !== 'tv') return { ...r, media: 'movie' };
        return {
          id: r.id,
          title: r.name || '',
          original_title: r.original_name || '',
          release_date: r.first_air_date || '',
          poster_path: r.poster_path || null,
          overview: r.overview,
          popularity: r.popularity,
          vote_count: r.vote_count,
          media: 'tv'
        };
      },

      _normTitle(t) {
        let x = String(t || '')
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .replace(/½/g, '1/2').replace(/¼/g, '1/4').replace(/¾/g, '3/4').replace(/⅓/g, '1/3')
          .replace(/[&]/g, 'and');

        // British and American spellings of the same film are the same film.
        // Three Colours: Blue was being reported as mislinked to Three
        // Colors: Blue, which is of course itself.
        for (const [from, to] of TITLE_SPELLINGS) x = x.replace(from, to);

        return x.replace(/[^a-z0-9]/g, '');
      },

      // TMDB sorts search results by popularity, not by how well they match.
      // Score every candidate instead of trusting the first one.
      // Letterboxd's year and TMDB's primary release year routinely disagree
      // by a year or three: festival premiere vs wide release, restorations,
      // delayed foreign distribution. A hard +/-1 rule threw away correct
      // matches, so the tolerance is graduated instead. Beyond four years it
      // is a different film, and no title similarity should rescue it.
      _yearScore(candYear, wantYear) {
        const cy = parseInt(candYear, 10);
        const wy = parseInt(wantYear, 10);
        if (!cy || !wy) return { points: 0, reject: false };
        const gap = Math.abs(cy - wy);
        if (gap === 0) return { points: 60, reject: false };
        if (gap === 1) return { points: 45, reject: false };
        if (gap <= 3) return { points: 25, reject: false };
        if (gap === 4) return { points: 5, reject: false };
        return { points: -100, reject: true };
      },

      _scoreCandidate(cand, wantTitle, wantYear) {
        const want = this._normTitle(wantTitle);
        const a = this._normTitle(cand.title);
        const b = this._normTitle(cand.original_title);
        let score = 0;
        let exact = false;

        // A prefix match only means something if the shorter side has real
        // length. Exit 8's original title '8番出口' reduces to '8', which
        // would otherwise "prefix-match" 81/2 ('812') on a single character.
        const prefixHit = (x) => x && x.length >= 4 && (x.startsWith(want) || want.startsWith(x))
                                   && Math.min(x.length, want.length) >= 4;
        if (a === want || b === want) { score += 100; exact = true; }
        else if (want.length >= 4 && (prefixHit(a) || prefixHit(b))) score += 40;

        const cy = cand.release_date ? cand.release_date.substring(0, 4) : null;
        const ys = this._yearScore(cy, wantYear);
        score += ys.points;

        // popularity only ever breaks a tie
        score += Math.min(10, (cand.popularity || 0) / 20);
        return { score, exact, reject: ys.reject, year: cy };
      },

      // 90 means: an exact title match, or a near-title plus a plausible year.
      // Two extra refusals on top of that, because a wrong id is far more
      // expensive than a missing one:
      //   - if the log has no year, an exact title is only trustworthy when
      //     exactly one candidate carries it. Two same-named films and no
      //     year is a coin flip, which is how remakes stole the originals.
      //   - if the runner-up is within 15 points, the choice is not clear
      //     enough to make silently.
      _bestTmdbMatch(results, title, year) {
        const out = this._rankTmdbCandidates(results, title, year);
        return out.match;
      },

      _rankTmdbCandidates(results, title, year) {
        if (!results || !results.length) return { match: null, reason: 'none', candidates: [] };

        const scored = [];
        for (const r of results) {
          const sc = this._scoreCandidate(r, title, year);
          if (sc.reject) continue;                    // outside the year window entirely
          scored.push({ cand: r, ...sc });
        }
        if (!scored.length) return { match: null, reason: 'none', candidates: [] };
        scored.sort((a, b) => b.score - a.score);

        const top = scored[0];
        const runnerUp = scored[1];

        if (top.score < 90) return { match: null, reason: 'low', candidates: scored.slice(0, 5) };

        const hasYear = !!parseInt(year, 10);
        if (!hasYear) {
          const exacts = scored.filter(x => x.exact);
          if (exacts.length > 1) {
            return { match: null, reason: 'ambiguous-no-year', candidates: exacts.slice(0, 5) };
          }
        }

        if (runnerUp && runnerUp.score >= 90 && (top.score - runnerUp.score) < 15) {
          // Popularity is capped at 10 points, so two films sharing a title
          // AND a year can never open a 15 point gap: every such pair was
          // being refused, including Disney's Aladdin against a mockbuster.
          // A landslide in popularity is real evidence.
          // vote_count is the sturdier signal: Disney's Aladdin carries
          // thousands, a same-year knockoff carries single digits. TMDB
          // rebases popularity periodically, so thresholds on it rot.
          const tv = top.cand.vote_count || 0;
          const rv = runnerUp.cand.vote_count || 0;
          const tp = top.cand.popularity || 0;
          const rp = runnerUp.cand.popularity || 0;
          const landslide = (tv >= 50 && tv >= Math.max(1, rv) * 10) || (tp >= 20 && tp >= rp * 5);
          if (!landslide) return { match: null, reason: 'ambiguous-close', candidates: scored.slice(0, 5) };
        }

        return { match: top.cand, reason: 'ok', candidates: scored.slice(0, 5) };
      },

      async _findTmdbMovie(title, year) {
        const out = await this._findTmdbMovieDetailed(title, year);
        return out.match;
      },

      // Series are only considered once films come up empty, so nothing that
      // already resolves as a film can be pulled sideways into television.
      // Every manual picker searched films only, so a series could never be
      // found by hand no matter how obvious it was. This returns both,
      // tagged, with the closest title first and the better-known entry
      // ahead of an obscure namesake.
      async _searchAny(query, includeTv = true) {
        const q = encodeURIComponent(query);
        const urls = [`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${q}`];
        if (includeTv) urls.push(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_API_KEY}&query=${q}`);

        const pages = await Promise.all(urls.map(async (u, i) => {
          try {
            const res = await fetch(u);
            if (!res.ok) return [];
            const data = await res.json();
            return (data.results || []).map(r => this._normTmdbResult(r, i === 0 ? 'movie' : 'tv'));
          } catch (e) { return []; }
        }));

        const want = this._normTitle(query);
        return pages.flat()
          .map(r => ({
            id: r.id,
            title: r.title,
            original_title: r.original_title,
            poster_path: r.poster_path || null,
            media: r.media,
            vote_count: r.vote_count || 0,
            popularity: r.popularity || 0,
            release_year: r.release_date ? String(r.release_date).substring(0, 4) : ''
          }))
          .filter(r => r.title)
          .sort((a, b) => {
            const ax = this._normTitle(a.title) === want ? 1 : 0;
            const bx = this._normTitle(b.title) === want ? 1 : 0;
            // exact titles first, then films ahead of series, then reach
            return bx - ax
              || (a.media === b.media ? 0 : a.media === 'movie' ? -1 : 1)
              || b.vote_count - a.vote_count
              || b.popularity - a.popularity;
          })
          .slice(0, 10);
      },

      async _searchTv(title, year) {
        const q = encodeURIComponent(title);
        const tries = [];
        if (year && /^\d{4}$/.test(String(year).trim())) {
          tries.push(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_API_KEY}&query=${q}&first_air_date_year=${String(year).trim()}`);
        }
        tries.push(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_API_KEY}&query=${q}`);
        for (const url of tries) {
          try {
            const res = await fetch(url);
            if (!res.ok) continue;
            const data = await res.json();
            const norm = (data.results || []).map(r => this._normTmdbResult(r, 'tv'));
            const ranked = this._rankTmdbCandidates(norm, title, year);
            if (ranked.match) return ranked;
          } catch (e) { /* try the next form */ }
        }
        return { match: null, reason: 'none', candidates: [] };
      },

      async _findTmdbMovieDetailed(title, year, allowTv = true) {
        const base = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(title)}`;
        let last = { match: null, reason: 'none', candidates: [] };

        // Narrow by year first; TMDB's own filter beats anything we can do
        // client-side at separating a remake from the original.
        if (year && /^\d{4}$/.test(String(year).trim())) {
          try {
            const res = await fetch(`${base}&year=${String(year).trim()}`);
            if (res.ok) {
              const data = await res.json();
              last = this._rankTmdbCandidates(data.results, title, year);
              if (last.match) return last;
            }
          } catch (e) { /* fall through to the unfiltered search */ }
        }

        // Unfiltered pass. The graduated year scoring still applies, so a
        // release that TMDB dates two years off the Letterboxd year is now
        // found rather than thrown away.
        try {
          const res = await fetch(base);
          if (res.ok) {
            const data = await res.json();
            const wide = this._rankTmdbCandidates(data.results, title, year);
            if (wide.match) return wide;
            if (wide.candidates.length) last = wide;
          }
        } catch (e) { /* no match */ }

        if (allowTv) {
          const tv = await this._searchTv(title, year);
          if (tv.match) return tv;
        }
        return last;
      },

      async enrichMissingMetadata(isManualTrigger = false) {
        const client = getDb();
        if (!client || this.isEnriching) return;

        const missing = this.logs.filter(l => (!l.poster_path || !l.director || !l.tmdb_id) && l.movie_title);
        if (missing.length === 0) {
          if (isManualTrigger) alert('All movies already have complete posters & metadata!');
          return;
        }

        // Background passes take a slice at a time so a large library never
        // turns sign-in into a ten minute network storm. Manual sync does all.
        const BACKGROUND_CAP = 150;
        const queue = isManualTrigger ? missing : missing.slice(0, BACKGROUND_CAP);

        this.isEnriching = true;
        let done = 0;
        let lastPaint = 0;
        let changed = false;

        let unmatched = 0;
        let ambiguous = 0;

        await pool(queue, 6, async (l) => {
          try {
            // An id already on the row is trusted, not second-guessed. The
            // row only reaches this queue because a poster or director is
            // missing; re-running a title search would let a bad search
            // result overwrite an id that was corrected by hand.
            let movieId = (l.tmdb_id && String(l.tmdb_id).trim()) ? String(l.tmdb_id).trim() : '';
            let poster = l.poster_path || '';
            let media = this._media(l);

            if (!movieId) {
              // Year-constrained, scored match. Returns null rather than
              // guessing, so a wrong tmdb_id never gets written.
              const found = await this._findTmdbMovieDetailed(l.movie_title, l.release_year);
              if (found.match) {
                movieId = String(found.match.id);
                media = found.match.media || 'movie';
                if (!poster) poster = found.match.poster_path || '';
              } else {
                unmatched++;
                if (found.reason === 'ambiguous-no-year' || found.reason === 'ambiguous-close') ambiguous++;
              }
            }

            if (movieId) {
              const updates = { tmdb_id: movieId };
              if (poster) updates.poster_path = poster;
              if (!this.mediaTypeUnsupported && media === 'tv') updates.media_type = 'tv';

              if (!updates.poster_path || !l.director) {
                // One request for details + credits instead of two.
                try {
                  const res = await fetch(this._tmdbUrl(media, `/${movieId}`, 'append_to_response=credits'));
                  if (res.ok) {
                    const d = await res.json();
                    if (!updates.poster_path && d.poster_path) updates.poster_path = d.poster_path;
                    // Series have creators rather than a director.
                    const dir = d.credits && d.credits.crew && d.credits.crew.find(c => c.job === 'Director');
                    if (dir) updates.director = dir.name;
                    else if (media === 'tv' && d.created_by && d.created_by.length) updates.director = d.created_by[0].name;
                  }
                } catch (e) { /* details are optional */ }
              }

              let { error } = await client.from('logs').update(updates).eq('id', l.id);
              if (error && this._isMissingMediaColumn(error)) {
                this.mediaTypeUnsupported = true;
                const { media_type, ...rest } = updates;
                ({ error } = await client.from('logs').update(rest).eq('id', l.id));
              }
              if (!error) {
                changed = true;
                // Patch the in-memory row too, so the final refetch is the
                // only full reload we ever pay for.
                Object.assign(l, updates);
              }
            }
          } catch (e) { /* skip this title */ }

          done++;
          // Repainting a status string 2,000 times is itself a bottleneck.
          const now = Date.now();
          if (now - lastPaint > 250 || done === queue.length) {
            lastPaint = now;
            this.enrichStatus = `⚡ Syncing metadata (${done}/${queue.length})`;
          }
        });

        this.isEnriching = false;
        if (changed) this._touch();

        const remaining = missing.length - queue.length;
        const ambNote = ambiguous > 0 ? ` ${ambiguous} of those were too close to call — usually a missing release year.` : '';
        const skipNote = unmatched > 0 ? ` ${unmatched} had no confident match — run Check Matches to review them.${ambNote}` : '';
        this.enrichStatus = remaining > 0
          ? `✅ Synced ${queue.length}. ${remaining} left — hit Sync Metadata to finish.${skipNote}`
          : `✅ Metadata fully synced!${skipNote}`;
        setTimeout(() => { this.enrichStatus = ''; }, 4000);
      },

      openMemberProfile(username) {
        this.activeMemberProfile = username || this.username;
        this.activeTab = 'profile';
        this.profLogLimit = 40;
        this.wlLimit = 50;
      },
      getProfile(name) { return this._indexes().profileByName.get((name || '').trim().toLowerCase()); },

      // ================= PROFILE EDITOR =================
      // The favourite-person and favourite-movie columns may be text or
      // jsonb depending on how the table was created, so everything is
      // read tolerantly and written back in whichever shape is already
      // there. A JSON string is the default because it is valid for both.
      _parseMaybeJson(v, fallback) {
        if (v === null || v === undefined || v === '') return fallback;
        if (typeof v === 'object') return v;
        try { const out = JSON.parse(v); return out === null ? fallback : out; } catch (e) { return fallback; }
      },

      _storeAs(existing, value) {
        if (existing !== null && existing !== undefined && typeof existing === 'object') return value;
        return JSON.stringify(value);
      },

      // Mirrors getPersonObj: a value that is not JSON is treated as a
      // plain name rather than discarded, so opening the editor can never
      // silently wipe a favourite that the profile page was displaying.
      _personFromStored(v) {
        if (v === null || v === undefined || v === '') return null;
        if (typeof v === 'object') return v;
        try {
          const out = JSON.parse(v);
          if (out && typeof out === 'object') return out;
          return { name: String(out), profile_path: null };
        } catch (e) {
          return { name: String(v), profile_path: null };
        }
      },

      getFavMovies(name) {
        const list = this._parseMaybeJson(this.getProfile(name)?.fav_movies, []);
        return Array.isArray(list) ? list : [];
      },

      // A banner URL is interpolated into a CSS url(...) wrapper, so a value
      // containing a quote or bracket could close the declaration early and
      // inject arbitrary CSS. Only plain absolute http(s) URLs get through.
      _safeImageUrl(u) {
        if (!u) return '';
        const str = String(u).trim();
        if (/["'()\\]/.test(str) || /[\u0000-\u001f]/.test(str)) return '';
        let parsed;
        try { parsed = new URL(str); } catch (e) { return ''; }
        if (parsed.protocol !== 'https:' && parsed.protocol !== 'http:') return '';
        return str;
      },

      openProfileEditor() {
        const prof = this.getProfile(this.username) || {};
        this.profileError = '';
        this.profileForm = {
          bio: prof.bio || '',
          avatar_url: prof.avatar_url || '',
          banner_url: prof.banner_url || '',
          fav_director: this._personFromStored(prof.fav_director),

      async saveProfile() {
        if (this.profileSaving) return;
        this.profileError = '';

        for (const [label, url] of [['Avatar', this.profileForm.avatar_url], ['Banner', this.profileForm.banner_url]]) {
          if (url && !this._safeImageUrl(url)) {
            this.profileError = `${label} URL must be a plain https link with no quotes or brackets.`;
            return;
          }
        }

        const client = getDb();
        if (!client) { this.profileError = 'Cannot reach the server. Try again in a moment.'; return; }

        const existing = this.getProfile(this.username);
        const row = {
          username: existing ? existing.username : this.username,
          bio: this.profileForm.bio || '',
          avatar_url: this.profileForm.avatar_url.trim() || null,
          banner_url: this.profileForm.banner_url.trim() || null,
          fav_director: this.profileForm.fav_director ? this._storeAs(existing?.fav_director, this.profileForm.fav_director) : null,
          fav_actor: this.profileForm.fav_actor ? this._storeAs(existing?.fav_actor, this.profileForm.fav_actor) : null,
          fav_actress: this.profileForm.fav_actress ? this._storeAs(existing?.fav_actress, this.profileForm.fav_actress) : null,
          fav_movies: this._storeAs(existing?.fav_movies, this.profileForm.fav_movies)
        };

        this.profileSaving = true;
        let error = null;
        if (existing) {
          ({ error } = await client.from('profiles').update(row).eq('username', existing.username));
        } else {
          ({ error } = await client.from('profiles').insert([row]));
        }
        this.profileSaving = false;

        if (error) {
          // The most likely cause by far is a missing RLS write policy,
          // since nothing in this app has ever written to profiles before.
          const msg = error.message || 'Unknown error';
          this.profileError = /policy|permission|denied|row-level/i.test(msg)
            ? `Supabase rejected the write: ${msg}. The profiles table likely has no update policy yet — see the note under Troubleshooting.`
            : `Could not save: ${msg}`;
          console.error('[profile save]', error);
          return;
        }

        await this.fetchProfiles();
        this.showProfileEditModal = false;
      },
      getProfileBannerStyle(name) {
        const prof = this.getProfile(name);
        const url = this._safeImageUrl(prof?.banner_url) || 'https://i.postimg.cc/yNMP6CjF/94f007e6-4f2b-4c86-abd8-d7fab834839b.jpg';
        return `background-image: linear-gradient(to bottom, rgba(23, 23, 23, 0.3), rgba(23, 23, 23, 0.9)), url('${url}')`;
      },
      getPersonObj(val) {
        if (val && typeof val === 'object') return val;
        if (_personCache.has(val)) return _personCache.get(val);
        let out;
        try { out = JSON.parse(val); } catch (e) { out = { name: val }; }
        _personCache.set(val, out);
        return out;
      },
      getPersonName(val) { return this.getPersonObj(val)?.name || ''; },
      getUniqueUsers() { return memo(`users|${this.dataVersion}`, () => [...new Set(this.logs.map(l => l.username || 'Anonymous'))].sort()); },
      filteredLogs() {

      async openMovieDetails(item) {
        this.loadingMovieDetails = true;
        this.showMovieDetailsModal = true;
        
        let tmdbId = item.tmdb_id || item.id;
        let title = item.movie_title || item.title;
        const wantYear = String(item.release_year || '').trim();
        const wantNorm = this._normTitle(title);

        // When BOTH sides carry a tmdb_id, that id is authoritative in both
        // directions: same id means same film, different id means different
        // film no matter how alike the titles look. Only when at least one
        // side is unidentified do we fall back to the title, normalised so
        // '8 1/2' folds onto '8½'. Year separates remakes when both have one.
        const clubReviews = this.logs.filter(l => {
          if (tmdbId && l.tmdb_id) return String(l.tmdb_id) === String(tmdbId);
          if (!l.movie_title || this._normTitle(l.movie_title) !== wantNorm) return false;
          const ly = String(l.release_year || '').trim();
          return !wantYear || !ly || ly === wantYear;
        });

        // One rating per member, matching the histogram beneath it, which
        // has always deduplicated this way.
        const validRatings = this._ratingsOnePerMember(clubReviews);
        const clubAvg = this._averageOf(validRatings) || 'N/A';

        this.selectedMovieDetail = {
          id: tmdbId,
          title: title,
          poster_path: item.poster_path,
          release_year: item.release_year || '',
          overview: '',
          tmdbRating: null,
          clubReviews: clubReviews,
          clubAvgRating: clubAvg,
          rawMovieObj: { id: tmdbId, title: title, poster_path: item.poster_path, release_date: item.release_year ? item.release_year + '-01-01' : '' }
        };

        const media = this._media(item.media_type ? item : (clubReviews[0] || item));
        this.selectedMovieDetail.media = media;

        if (tmdbId) {
          try {
            const res = await fetch(this._tmdbUrl(media, `/${tmdbId}`, 'append_to_response=credits'));
            if (res.ok) {
              const data = await res.json();
              this.selectedMovieDetail.overview = data.overview;
              this.selectedMovieDetail.tmdbRating = data.vote_average ? data.vote_average.toFixed(1) : null;
              // A series reports runtime per episode and has no single one.
              this.selectedMovieDetail.runtime = media === 'tv'
                ? (data.episode_run_time && data.episode_run_time[0]) || null
                : data.runtime;
              if (media === 'tv') {
                this.selectedMovieDetail.seasons = data.number_of_seasons || null;
                this.selectedMovieDetail.episodes = data.number_of_episodes || null;
              }
              this.selectedMovieDetail.genres = data.genres ? data.genres.map(g => g.name) : [];
              const cast = (data.credits && data.credits.cast) || (data.aggregate_credits && data.aggregate_credits.cast) || [];
              if (cast.length) {
                this.selectedMovieDetail.cast = cast.slice(0, 6).map(c => ({ name: c.name, character: c.character, profile_path: c.profile_path }));
              }
            }
          } catch (e) {}
        }
        this.loadingMovieDetails = false;
      },

        if (!this.searchQuery.trim()) return;
        // Series are searchable here too, so one can be logged in the first
        // place rather than only repaired after the fact.
        const found = await this._searchAny(this.searchQuery.trim());
        this.searchResults = found.map(r => ({

      openReviewDetails(log) {

      // My most recent log of the film currently open, so the rating can be

      myLogForDetail() {

      async quickSetRatingFromDetail(value) {

      // The still shown at the top of a review is simply the first one, so

      reviewHeaderStill(log) {

      async _patchLog(log, patch) {
        if (!log || !this.isOwner(log)) return false;
        const client = getDb();
        if (!client) return false;
        this.quickEditBusy = true;
        const { error } = await client.from('logs').update(patch).eq('id', log.id);
        this.quickEditBusy = false;
        if (error) { alert('Could not save: ' + error.message); return false; }
        Object.assign(log, patch);
        const live = this.logs.find(l => l.id === log.id);
        if (live && live !== log) Object.assign(live, patch);
        this._touch();
        return true;
      },

      // Re-rating used to mean reopening the whole log form.
      async quickSetRating(log, value) {
        const next = (log.rating !== null && Number(log.rating) === Number(value)) ? null : Number(value);
        await this._patchLog(log, { rating: next });
      },

      // Letterboxd anchors a diary entry to the day you watched it, not the

      async quickSetDate(log) {
        const v = (this.quickDate || '').trim();

        await this._patchLog(log, { stills: st });

      // Profile history, read the same way as the diary.
      getMemberDiaryGroups(username) {
        const key = `mdiary|${username}|${this.profFilterRating}|${this.profFilterDecade}|${this.profFilterSearch}|${this.dataVersion}`;
        return memo(key, () => {
          const keyed = this.getFilteredMemberLogs(username)
            .filter(l => l.created_at)
            .map(l => [Date.parse(l.created_at) || 0, l])
            .sort((a, b) => b[0] - a[0]);

          const groups = [];
          let current = null;
          for (const [ts, l] of keyed) {
            const d = new Date(ts);
            const label = d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
            if (!current || current.label !== label) {
              current = { label, key: label, entries: [], logs: [] };
              groups.push(current);
            }
            current.entries.push({ log: l, day: d.getDate(), weekday: d.toLocaleDateString('en-GB', { weekday: 'short' }) });
            current.logs.push(l);
          }
          return groups;
        });
      },

      diaryWeekday(log) {
        return log && log.created_at
          ? new Date(log.created_at).toLocaleDateString('en-GB', { weekday: 'short' })
          : '';
      },

      getMemberDiaryPaged(username) {
        const limit = this.profLogLimit;
        const out = [];
        let used = 0;
        for (const g of this.getMemberDiaryGroups(username)) {
          if (used >= limit) break;
          const room = limit - used;
          out.push(room >= g.entries.length ? g : { ...g, entries: g.entries.slice(0, room), logs: g.logs.slice(0, room) });
          used += Math.min(room, g.entries.length);
        }
        return out;
      },

      },
      setDiaryScope(v) { this.diaryScope = v; this.diaryLimit = 60; },
      getYearsList() { const y = []; for (let i = 2030; i >= 1980; i--) y.push(i); return y; },
      // The calendar answers "what did we watch in March". The diary answers
      // "what have we been watching", which is the question people actually
      // open the app with. Same data, read the other way round.
      getDiaryGroups() {
        const key = `diary|${this.diaryScope}|${this.dataVersion}`;
        return memo(key, () => {
          const me = (this.username || '').trim().toLowerCase();
          const rows = this.diaryScope === 'mine'
            ? (this._indexes().logsByUser.get(me) || [])
            : this.logs;

          const keyed = rows
            .filter(l => l.created_at)
            .map(l => [Date.parse(l.created_at) || 0, l])
            .sort((a, b) => b[0] - a[0]);

          const groups = [];
          let current = null;
          for (const [ts, l] of keyed) {
            const d = new Date(ts);
            // Local time, so an evening viewing does not slide into tomorrow.
            const label = d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });

      // Groups trimmed to the current window, so a long history does not

      getDiaryPaged() {

          out.push(room >= g.entries.length ? g : { ...g, entries: g.entries.slice(0, room) });
