      changeCalMonth(delta) { this.calMonth += delta; if (this.calMonth > 11) { this.calMonth = 0; this.calYear++; } else if (this.calMonth < 0) { this.calMonth = 11; this.calYear--; } },
      getCalMonthOnlyLabel() { return new Date(2026, this.calMonth, 1).toLocaleDateString(undefined, { month: 'long' }); },
      getCalGrid() {
        return memo(`cal|${this.calYear}|${this.calMonth}|${this.dataVersion}`, () => {
          const byDate = this._indexes().logsByDate;
          const firstDay = new Date(this.calYear, this.calMonth, 1).getDay();
          const totalDays = new Date(this.calYear, this.calMonth + 1, 0).getDate();
          const grid = [];
          for (let i = 0; i < firstDay; i++) grid.push({ blankId: 'b-' + i, dayNum: '' });
          const mStr = String(this.calMonth + 1).padStart(2, '0');
          for (let d = 1; d <= totalDays; d++) {
            const dateKey = `${this.calYear}-${mStr}-${String(d).padStart(2, '0')}`;
            grid.push({ dateKey, dayNum: d, logs: byDate.get(dateKey) || EMPTY });
          }
          return grid;
        });
      },
      // The details modal is where a bad match is actually noticed, but it
      // is showing a film rather than a specific log. Pick any log of this
      // film to act as the target; the relink then fans out to its siblings.
      fixMatchFromDetails() {
        const d = this.selectedMovieDetail;
        if (!d) return;
        const wantId = d.id ? String(d.id) : '';
        const wantNorm = this._normTitle(d.title);
        const wantYear = String(d.release_year || '').trim();

        let target = this.logs.find(l => wantId && l.tmdb_id && String(l.tmdb_id) === wantId);
        if (!target) {
          target = this.logs.find(l => this._normTitle(l.movie_title) === wantNorm &&
            (!wantYear || !l.release_year || String(l.release_year) === wantYear));
        }
        if (!target) { alert('No logs found for this film, so there is nothing to relink.'); return; }

        // Prefer your own copy as the target when you have one, so the
        // default (non-global) relink still does something useful.
        const mine = this.logs.find(l => (l.username || '').trim().toLowerCase() === (this.username || '').trim().toLowerCase() &&
          this._normTitle(l.movie_title) === this._normTitle(target.movie_title) &&
          String(l.release_year || '') === String(target.release_year || ''));

        // One row drives both the relink target and the prefilled search,
        // otherwise the modal opens on your copy but searches someone
        // else's spelling of the title.
        const chosen = mine || target;

        this.showMovieDetailsModal = false;
        // openLogPosterPicker clears the relink panel synchronously before
        // its first await, so these assignments must come after the call.
        this.openLogPosterPicker(chosen);
        // Default to fixing it for everyone: a wrong TMDB id is wrong club-wide.
        this.relinkAllMembers = true;
        this.relinkQuery = (chosen.movie_title || '') + (chosen.release_year ? ' ' + chosen.release_year : '');
        this.searchRelink();
      },

      // ================= CUSTOM LISTS =================
      // items may be a jsonb array or a JSON string in a text column, so
      // read it tolerantly and write it back in whichever shape is there.
      getListItems(list) {
        const v = this._parseMaybeJson(list && list.items, []);
        return Array.isArray(v) ? v : [];
      },

      isListOwner(list) {
        return !!list && (list.username || '').trim().toLowerCase() === (this.username || '').trim().toLowerCase();
      },

      isFavoriteList(list) { return !!(list && list.is_favorite); },

      // Favourites drive the future club-wide aggregation, so they sort to
      // the top rather than being hidden behind a filter by default.
      getVisibleLists() {
        return memo(`vlists|${this.listFilter}|${this.dataVersion}`, () => {
          let out = this.lists.slice();
          if (this.listFilter === 'fav') out = out.filter(l => this.isFavoriteList(l));
          return out.sort((a, b) =>
            (this.isFavoriteList(b) ? 1 : 0) - (this.isFavoriteList(a) ? 1 : 0) ||
            (Date.parse(b.created_at) || 0) - (Date.parse(a.created_at) || 0));
        });
      },

      favoriteListCount() { return this.lists.filter(l => this.isFavoriteList(l)).length; },

      // Quick toggle straight from the list card.
      async toggleListFavorite(list) {
        if (!this.isListOwner(list)) return;
        const client = getDb();
        if (!client) return;
        const next = !this.isFavoriteList(list);
        const { error } = await client.from('lists').update({ is_favorite: next }).eq('id', list.id);
        if (error) {
          if (this._isMissingFavoriteColumn(error)) {
            this.listFavoriteUnsupported = true;
            alert('The lists table has no is_favorite column yet. Run:\n\nalter table lists add column is_favorite boolean not null default false;');
          } else {
            alert('Could not update: ' + error.message);
          }
          return;
        }
        list.is_favorite = next;
        this._touch();
      },

      mediaTypeUnsupported: false,
      _isMissingMediaColumn(error) {
        const m = (error && error.message) || '';
        return /media_type/i.test(m) && /(does not exist|could not find|schema cache|unknown column)/i.test(m);
      },

      // Series need a badge so they are not mistaken for films in the feed.
      isSeries(row) { return this._media(row) === 'tv'; },

      _isMissingFavoriteColumn(error) {
        const m = (error && error.message) || '';
        return /is_favorite/i.test(m) && /(does not exist|could not find|schema cache|unknown column)/i.test(m);
      },

      // ---- per-item artwork on a list -------------------------------
      // Films imported without a TMDB id have no artwork to choose from,
      // so the same panel first offers a search to identify the film.
      // context 'editor' edits the unsaved draft; context 'detail' edits a
      // list that already exists, so the change is written immediately.
      async openListPosterPicker(idx, context = 'editor') {
        const working = context === 'detail'
          ? this.getListItems(this.selectedListDetail)
          : this.newList.items;
        const item = working[idx];
        if (!item) return;
        this.listPoster = {
          open: true, idx, context, workingItems: working,
          id: item.id || null, title: item.title || '',
          options: [], busy: false, query: '', results: []
        };
        if (item.id) await this._loadListPosters(item.id);
        else this.listPoster.query = (item.title || '') + (item.release_year ? ' ' + item.release_year : '');
      },

      _posterTargetItems() {
        return this.listPoster.context === 'detail' ? (this.listPoster.workingItems || []) : this.newList.items;
      },

      async _persistListItems(list, items, silent) {
        const client = getDb();
        if (!client || !list) return false;
        const stored = this._storeAs(list.items, items);
        const { error } = await client.from('lists').update({ items: stored }).eq('id', list.id);
        if (error) {
          if (!silent) alert('Could not save artwork: ' + error.message);
          else console.error('[list fix]', list.title, error.message);
          return false;
        }
        list.items = stored;
        const inList = this.lists.find(l => l.id === list.id);
        if (inList && inList !== list) inList.items = stored;
        this._touch();
        return true;
      },

      async _commitPosterChange() {
        if (this.listPoster.context !== 'detail') return;
        await this._persistListItems(this.selectedListDetail, this.listPoster.workingItems);
      },

      async _loadListPosters(tmdbId) {
        this.listPoster.busy = true;
        try {
          const item = this.newList.items[this.listPoster.idx] || {};
          const res = await fetch(this._tmdbUrl(this._media(item), `/${tmdbId}/images`));
          if (res.ok) {
            const data = await res.json();
            this.listPoster.options = (data.posters || []).slice(0, 24).map(pp => pp.file_path);
          }
        } catch (e) { console.error('TMDB images failed:', e); }
        this.listPoster.busy = false;
      },

      async searchListPosterFilm() {
        const q = (this.listPoster.query || '').trim();
        if (!q) { this.listPoster.results = []; return; }
        this.listPoster.busy = true;
        this.listPoster.results = await this._searchAny(q);
        this.listPoster.busy = false;
      },

      // Identify a title-only entry, which also backfills its id and year.
      async attachListPosterFilm(movie) {
        const item = this._posterTargetItems()[this.listPoster.idx];
        if (!item) return;
        item.id = movie.id;
        item.title = movie.title;
        item.media_type = movie.media || 'movie';
        if (movie.release_year) item.release_year = movie.release_year;
        if (movie.poster_path) item.poster_path = movie.poster_path;
        this.listPoster.id = movie.id;
        this.listPoster.title = movie.title;
        this.listPoster.results = [];
        await this._commitPosterChange();
        await this._loadListPosters(movie.id);
      },

      async pickListPoster(path) {
        const item = this._posterTargetItems()[this.listPoster.idx];
        if (item) item.poster_path = path;
        await this._commitPosterChange();
        this.listPoster.open = false;
      },

      openListDetail(list) {
        this.listPoster.open = false;
        this.listBannerPicker.open = false;
        this.selectedListDetail = list;
        this.loadListBanner(list);
      },

      // A list header reads far better with a still behind it than with a
      // wall of posters. We only store poster paths on list items, so the
      // backdrop is fetched once per list and remembered.
      listBanner: null,
      listBannerPicker: { open: false, filmIdx: -1, options: [], busy: false },

      // A chosen banner lives on the list item that provides it, inside the
      // items JSON we already store. No extra column, and it travels with
      // the list wherever the items go.
      listBannerPath(list) {
        const chosen = this.getListItems(list).find(m => m && m.banner);
        return chosen ? chosen.banner : this.listBanner;
      },

      openListBannerPicker() {
        this.listBannerPicker = { open: true, filmIdx: -1, options: [], busy: false };
      },

      async loadBannerOptions(idx) {
        const item = this.getListItems(this.selectedListDetail)[idx];
        if (!item || !item.id) return;
        this.listBannerPicker.filmIdx = idx;
        this.listBannerPicker.options = [];
        this.listBannerPicker.busy = true;
        try {
          const res = await fetch(this._tmdbUrl(this._media(item), `/${item.id}/images`));
          if (res.ok) {
            const data = await res.json();
            this.listBannerPicker.options = (data.backdrops || []).slice(0, 12).map(b => b.file_path);
          }
        } catch (e) { console.error('TMDB images failed:', e); }
        this.listBannerPicker.busy = false;
      },

      async pickListBanner(path) {
        const list = this.selectedListDetail;
        if (!list || !this.isListOwner(list)) return;
        const items = this.getListItems(list);
        // Exactly one item owns the banner at a time.
        items.forEach(m => { if (m && m.banner) delete m.banner; });
        const target = items[this.listBannerPicker.filmIdx];
        if (target) target.banner = path;
        const ok = await this._persistListItems(list, items);
        if (ok) {
          this.listBanner = path;
          this.listBannerPicker.open = false;
        }
      },

      async clearListBanner() {
        const list = this.selectedListDetail;
        if (!list || !this.isListOwner(list)) return;
        const items = this.getListItems(list);
        let touched = false;
        items.forEach(m => { if (m && m.banner) { delete m.banner; touched = true; } });
        if (touched) await this._persistListItems(list, items);
        this.listBanner = null;
        this.listBannerPicker.open = false;
        this.loadListBanner(list);   // fall back to the automatic pick
      },

      async loadListBanner(list) {
        this.listBanner = null;
        if (!list) return;

        // A banner the owner picked wins over anything we would guess.
        const chosen = this.getListItems(list).find(m => m && m.banner);
        if (chosen) { this.listBanner = chosen.banner; return; }

        const cacheKey = 'lb:' + list.id;
        if (_listBannerCache.has(cacheKey)) { this.listBanner = _listBannerCache.get(cacheKey); return; }

        const items = this.getListItems(list).filter(m => m && m.id);
        if (!items.length) { _listBannerCache.set(cacheKey, null); return; }

        // Try the first few, since not every film has a backdrop on TMDB.
        for (const item of items.slice(0, 4)) {
          try {
            const res = await fetch(this._tmdbUrl(this._media(item), `/${item.id}/images`));
            if (!res.ok) continue;
            const data = await res.json();
            const bd = (data.backdrops || [])[0];
            if (bd && bd.file_path) {
              _listBannerCache.set(cacheKey, bd.file_path);
              // The modal may have moved on while this was in flight.
              if (this.selectedListDetail && this.selectedListDetail.id === list.id) this.listBanner = bd.file_path;
              return;
            }
          } catch (e) { /* try the next film */ }
        }
        _listBannerCache.set(cacheKey, null);
      },

      openCreateListModal() {
        this.isEditingList = false;
        this.editingListId = null;
        this.newList = { title: '', description: '', items: [], is_favorite: false };
        this.listSearchQuery = '';
        this.listSearchResults = [];
        this.listError = '';
        this.listBusy = false;
        this.listPoster.open = false;
        this.showCreateListModal = true;
      },

      openEditListModal(list) {
        if (!this.isListOwner(list)) return;
        this.isEditingList = true;
        this.editingListId = list.id;
        this.newList = {
          title: list.title || '',
          description: list.description || '',
          items: this.getListItems(list).map(m => ({ ...m })),
          is_favorite: !!list.is_favorite
        };
        this.listPoster.open = false;
        this.listSearchQuery = '';
        this.listSearchResults = [];
        this.listError = '';
        this.listBusy = false;
        this.showCreateListModal = true;
      },

      async searchListMovies() {
        const q = (this.listSearchQuery || '').trim();
        if (!q) { this.listSearchResults = []; return; }
        this.listBusy = true;
        this.listSearchResults = await this._searchAny(q);
        this.listBusy = false;
      },

      addListMovie(m) {
        // Key on media as well as id: a film and a series can share an id.
        const media = m.media || 'movie';
        if (this.newList.items.some(x => String(x.id) === String(m.id) && this._media(x) === media)) return;
        this.newList.items.push({
          id: m.id, title: m.title, poster_path: m.poster_path,
          release_year: m.release_year || '',
          media_type: media
        });
        this.listSearchResults = [];
        this.listSearchQuery = '';
      },

      removeListMovie(idx) { this.newList.items.splice(idx, 1); },

      moveListMovie(idx, delta) {
        const to = idx + delta;
        if (to < 0 || to >= this.newList.items.length) return;
        const items = this.newList.items;
        [items[idx], items[to]] = [items[to], items[idx]];
      },

      async saveList() {
        if (this.listBusy) return;
        this.listError = '';
        const title = (this.newList.title || '').trim();
        if (!title) { this.listError = 'Give the list a title.'; return; }

        const client = getDb();
        if (!client) { this.listError = 'Cannot reach the server. Try again in a moment.'; return; }

        const existing = this.isEditingList ? this.lists.find(l => l.id === this.editingListId) : null;
        const row = {
          username: this.username,
          title,
          description: (this.newList.description || '').trim(),
          items: this._storeAs(existing && existing.items, this.newList.items)
        };
        if (!this.listFavoriteUnsupported) row.is_favorite = !!this.newList.is_favorite;

        this.listBusy = true;
        const write = (payload) => (this.isEditingList && this.editingListId)
          ? client.from('lists').update(payload).eq('id', this.editingListId)
          : client.from('lists').insert([payload]);

        let { error } = await write(row);

        // If the column has not been added yet, save the list anyway rather
        // than losing the user's work, and tell them what to run.
        if (error && this._isMissingFavoriteColumn(error)) {
          this.listFavoriteUnsupported = true;
          const { is_favorite, ...rest } = row;
          ({ error } = await write(rest));
          // The success path closes the modal, so a field-level message
          // would never be read. Use an alert that survives the close.
          if (!error) {
            alert('List saved, but the favourite flag was dropped because the column does not exist yet.\n\nRun this once in Supabase:\n\nalter table lists add column is_favorite boolean not null default false;');
          }
        }
        this.listBusy = false;

        if (error) {
          const msg = error.message || 'Unknown error';
          this.listError = /policy|permission|denied|row-level/i.test(msg)
            ? `Supabase rejected the write: ${msg}. The lists table likely has no write policy yet.`
            : `Could not save: ${msg}`;
          console.error('[saveList]', error);
          return;
        }

        await this.fetchLists();
        this.showCreateListModal = false;
      },

      async deleteList(id) {
        const list = this.lists.find(l => l.id === id);
        if (!this.isListOwner(list)) return;
        if (!confirm(`Delete the list "${list.title}"? This cannot be undone.`)) return;
        const client = getDb();
        if (!client) return;
        const { error } = await client.from('lists').delete().eq('id', id);
        if (error) { alert('Could not delete: ' + error.message); return; }
        this.lists = this.lists.filter(l => l.id !== id);
        this._touch();
        if (this.selectedListDetail && this.selectedListDetail.id === id) this.selectedListDetail = null;
      },

      // ================= LETTERBOXD LIST IMPORT =================
      // Exported list CSVs carry a metadata block (list name, description)
      // above the film rows, but the exact layout has shifted between
      // export versions. Rather than assume one shape, locate the film
      // header by looking for a row that names a column 'Name' alongside
      // 'Position' or 'Year', and read the list's own name from any header
      // block above it. Falls back to the filename for the title.
      _prettyListName(filename) {
        return String(filename || '')
          .split('/').pop()
          .replace(/\.csv$/i, '')
          .replace(/[-_]+/g, ' ')
          .trim() || 'Untitled list';
      },

      _parseListCsv(text, filename) {
        if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
        const rows = (Papa.parse(text, { skipEmptyLines: false }).data) || [];
        const cells = r => (r || []).map(c => String(c == null ? '' : c).trim());
        const lower = r => cells(r).map(c => c.toLowerCase());

        let filmHeader = -1;
        for (let i = 0; i < rows.length; i++) {
          const l = lower(rows[i]);
          if (l.includes('name') && (l.includes('position') || l.includes('year'))) { filmHeader = i; break; }
        }
        if (filmHeader === -1) return null;

        // list metadata from a header block above the film rows
        let title = '', description = '';
        for (let i = 0; i < filmHeader; i++) {
          const l = lower(rows[i]);
          if (l.includes('name') && !l.includes('year') && !l.includes('position')) {
            const v = cells(rows[i + 1] || []);
            const ni = l.indexOf('name'), di = l.indexOf('description');
            if (ni >= 0) title = v[ni] || '';
            if (di >= 0) description = v[di] || '';
            break;
          }
        }
        if (!title) title = this._prettyListName(filename);

        const h = lower(rows[filmHeader]);
        const ni = h.indexOf('name'), yi = h.indexOf('year'), pi = h.indexOf('position');
        const items = [];
        for (let i = filmHeader + 1; i < rows.length; i++) {
          const v = cells(rows[i]);
          if (!v.length || v.every(c => c === '')) continue;
          const t = ni >= 0 ? v[ni] : v[0];
          if (!t) continue;
          items.push({
            title: t,
            release_year: yi >= 0 ? (v[yi] || '') : '',
            position: pi >= 0 ? (parseInt(v[pi], 10) || items.length + 1) : items.length + 1
          });
        }
        items.sort((a, b) => a.position - b.position);

        return { title, description, items };
      },

      openListImportModal() {
        this.showListImportModal = true;
        this.listImportFound = [];
        this.listImportReport = null;
        this.listImportStatus = '';
        this.listImportProgress = '';
        this.listImportBusy = false;
      },

      handleListCsvDrop(e) {
        this.isDraggingListCsv = false;
        const files = e.dataTransfer && e.dataTransfer.files;
        if (files && files.length) this.loadListFiles(Array.from(files));
      },
      handleListCsvSelect(e) {
        const files = e.target && e.target.files;
        if (files && files.length) this.loadListFiles(Array.from(files));
      },

      // Accepts loose .csv files and also a full export .zip, in which case
      // every CSV under lists/ is picked up.
      async loadListFiles(files) {
        this.listImportBusy = true;
        this.listImportStatus = 'Reading files...';
        const found = [];

        for (const f of files) {
          try {
            if (/\.zip$/i.test(f.name)) {
              const zip = await new JSZip().loadAsync(f);
              const entries = zip.file(/\.csv$/i) || [];
              for (const entry of entries) {
                if (!/(^|\/)lists?\//i.test(entry.name)) continue;
                const parsed = this._parseListCsv(await entry.async('string'), entry.name);
                if (parsed && parsed.items.length) found.push({ ...parsed, source: entry.name });
              }
            } else if (/\.csv$/i.test(f.name)) {
              const parsed = this._parseListCsv(await f.text(), f.name);
              if (parsed && parsed.items.length) found.push({ ...parsed, source: f.name });
              else this.listImportProgress = `Could not find film rows in ${f.name}.`;
            }
          } catch (err) {
            console.error('[list import]', f.name, err);
            this.listImportProgress = `Failed to read ${f.name}: ${err.message}`;
          }
        }

        const mine = this.getMemberLists(this.username).map(l => (l.title || '').trim().toLowerCase());
        this.listImportFound = found.map((l, i) => ({
          key: 'l' + i,
          title: l.title,
          description: l.description,
          items: l.items,
          count: l.items.length,
          source: l.source,
          duplicate: mine.includes((l.title || '').trim().toLowerCase()),
          selected: !mine.includes((l.title || '').trim().toLowerCase())
        }));

        this.listImportBusy = false;
        this.listImportStatus = found.length
          ? `Found ${found.length} list${found.length === 1 ? '' : 's'}. Pick which to import.`
          : 'No lists found in those files.';
      },

      toggleAllLists(v) { this.listImportFound.forEach(l => { l.selected = v; }); },
      get selectedListCount() { return this.listImportFound.filter(l => l.selected).length; },

      async runListImport() {
        const chosen = this.listImportFound.filter(l => l.selected);
        if (!chosen.length) return;
        const client = getDb();
        if (!client) { this.listImportStatus = 'Cannot reach the server.'; return; }

        this.listImportBusy = true;
        this.listImportReport = null;

        // Films already in the club's logs give us a poster and a tmdb_id
        // for free, which covers most of a typical list with zero requests.
        const byKey = new Map();
        for (const l of this.logs) {
          if (!l.movie_title || !l.poster_path) continue;
          const n = this._normTitle(l.movie_title);
          const y = String(l.release_year || '').trim();
          if (y) byKey.set(n + '|' + y, l);
          if (!byKey.has(n)) byKey.set(n, l);
        }

        let matchedLocal = 0, matchedTmdb = 0, unresolved = 0;
        const needsLookup = [];

        for (const list of chosen) {
          list._resolved = list.items.map(it => {
            const n = this._normTitle(it.title);
            const y = String(it.release_year || '').trim();
            const hit = (y && byKey.get(n + '|' + y)) || byKey.get(n);
            if (hit) {
              matchedLocal++;
              return { id: hit.tmdb_id || null, title: it.title, poster_path: hit.poster_path || null, release_year: it.release_year || '' };
            }
            const stub = { id: null, title: it.title, poster_path: null, release_year: it.release_year || '' };
            needsLookup.push(stub);
            return stub;
          });
        }

        // Optional TMDB fill for whatever the logs did not cover. Capped so
        // a handful of big lists cannot fire thousands of requests.
        if (this.listImportFillPosters && needsLookup.length) {
          const CAP = 250;
          const queue = needsLookup.slice(0, CAP);
          let done = 0, lastPaint = 0;
          this.listImportStatus = 'Looking up posters on TMDB...';
          await pool(queue, 6, async (stub) => {
            const m = await this._findTmdbMovie(stub.title, stub.release_year);
            if (m) { stub.id = String(m.id); stub.poster_path = m.poster_path || null; matchedTmdb++; }
            done++;
            const now = Date.now();
            if (now - lastPaint > 250 || done === queue.length) {
              lastPaint = now;
              this.listImportProgress = `Resolved ${done} of ${queue.length} unmatched films...`;
            }
          });
        }
        unresolved = needsLookup.filter(x => !x.poster_path).length;

        this.listImportStatus = 'Saving lists...';
        const sample = this.lists[0];
        const rows = chosen.map(l => ({
          username: this.username,
          title: l.title,
          description: l.description || '',
          items: this._storeAs(sample && sample.items, l._resolved)
        }));

        let saved = 0, failed = 0;
        await pool(rows, 3, async (r) => {
          const { error } = await client.from('lists').insert([r]);
          if (error) { failed++; console.error('[list import]', r.title, error.message); }
          else saved++;
          this.listImportProgress = `Saved ${saved} of ${rows.length} lists...`;
        });

        await this.fetchLists();
        this.listImportBusy = false;
        this.listImportReport = {
          lists: saved, failed,
          films: chosen.reduce((n, l) => n + l.count, 0),
          matchedLocal, matchedTmdb, unresolved
        };
        this.listImportStatus = failed
          ? `Imported ${saved} of ${rows.length} lists (${failed} rejected — check console).`
          : `✅ Imported ${saved} list${saved === 1 ? '' : 's'}.`;
        this.listImportProgress = '';
      },

      // ================= METADATA ISSUE SCANNER =================
      // The old matcher took TMDB's most popular search hit and ignored the
      // release year, so anything with a famous namesake got mislinked.
      // Fixing those one at a time is hopeless at library scale. This finds
      // them in bulk and proposes the correction.
      //
      // Pass 1 is structural and free: contradictions that are visible in
      // the data alone. Pass 2 asks TMDB what each id actually is, which is
      // definitive but costs a request per distinct film.

      // A bad TMDB id does not only live in logs. The same film sits inside
      // custom lists, where it keeps the wrong poster until it is repointed
      // too. Match on the old id, or on title+year for entries that never
      // got an id at all.
      _attachListRefs(issue) {
        const want = this._normTitle(issue.title);
        const wantYear = String(issue.year || '').trim();
        const oldId = String(issue.tmdbId || '').trim();
        const me = (this.username || '').trim().toLowerCase();
        const refs = [];

        for (const list of this.lists) {
          const items = this.getListItems(list);
          const indices = [];
          items.forEach((m, i) => {
            const byId = oldId && m.id && String(m.id) === oldId;
            const byTitle = m.title && this._normTitle(m.title) === want &&
              (!wantYear || !m.release_year || String(m.release_year) === wantYear);
            if (byId || byTitle) indices.push(i);
          });
          if (!indices.length) continue;

          const owned = (list.username || '').trim().toLowerCase() === me;
          const entryTitle = (items[indices[0]] && items[indices[0]].title) || '';
          refs.push({
            id: list.id,
            title: list.title || 'Untitled list',
            username: list.username || 'Anonymous',
            owned,
            indices,
            entryTitle,
            // Only offer a retitle when the list actually disagrees with the
            // corrected film, so curated wording is left alone otherwise.
            needsRetitle: !!(issue.suggested && issue.suggested.title &&
              this._normTitle(entryTitle) !== this._normTitle(issue.suggested.title)),
            // Your own lists are ticked; someone else's curation is yours to
            // opt into rather than something that happens silently.
            selected: owned,
            retitle: false
          });
        }
        issue.lists = refs;
        return refs;
      },

      listRefsSelected(issue) {
        return (issue.lists || []).filter(r => r.selected).length;
      },

      // Only the scanner's Repair button used to write to lists, so a film
      // corrected through Wrong film?, through Sync Metadata, or before that
      // propagation existed, left its list entries pointing at the old id.
      // This reconciles every list against what the logs now say.
      _logIndexForLists() {
        const idx = new Map();
        for (const l of this.logs) {
          if (!l.movie_title || !l.tmdb_id || !String(l.tmdb_id).trim()) continue;
          const n = this._normTitle(l.movie_title);
          const y = String(l.release_year || '').trim();
          const rec = { tmdb_id: String(l.tmdb_id).trim(), poster_path: l.poster_path || '' };
          // A row that carries artwork is the better reference.
          const put = (k) => {
            const cur = idx.get(k);
            if (!cur || (!cur.poster_path && rec.poster_path)) idx.set(k, rec);
          };
          if (y) put(n + '|' + y);
          put(n);
        }
        return idx;
      },

      scanListSync() {
        const idx = this._logIndexForLists();
        const lists = [];
        let entries = 0;

        for (const list of this.lists) {
          const items = this.getListItems(list);
          const stale = [];
          items.forEach((m, i) => {
            if (!m || !m.title) return;
            const n = this._normTitle(m.title);
            const y = String(m.release_year || '').trim();
            const hit = (y && idx.get(n + '|' + y)) || idx.get(n);
            if (!hit) return;
            const itemId = m.id == null ? '' : String(m.id).trim();
            if (itemId !== hit.tmdb_id) stale.push({ i, reason: 'id', hit });
            else if (!m.poster_path && hit.poster_path) stale.push({ i, reason: 'poster', hit });
          });
          if (stale.length) {
            entries += stale.length;
            lists.push({
              id: list.id, title: list.title || 'Untitled list',
              username: list.username || 'Anonymous',
              count: stale.length, stale
            });
          }
        }

        this.listSync = { entries, lists };
        return this.listSync;
      },

      async repairListsFromLogs() {
        if (!this.listSync || !this.listSync.entries) return;
        const n = this.listSync.entries;
        if (!confirm(`Repoint ${n} list entr${n === 1 ? 'y' : 'ies'} at the films your logs now say they are? Artwork you picked by hand is kept.`)) return;

        this.listSyncBusy = true;
        let fixedLists = 0, fixedEntries = 0, failed = 0;

        for (const ref of this.listSync.lists) {
          const list = this.lists.find(l => l.id === ref.id);
          if (!list) continue;
          const items = this.getListItems(list);
          let touched = 0;
          for (const st of ref.stale) {
            const it = items[st.i];
            if (!it) continue;
            if (st.reason === 'id') {
              // The entry pointed at the wrong film, so its poster belonged
              // to that wrong film and goes with it.
              it.id = st.hit.tmdb_id;
              if (st.hit.poster_path) it.poster_path = st.hit.poster_path;
            } else if (!it.poster_path && st.hit.poster_path) {
              // Right film, just missing artwork. Anything deliberately
              // chosen is left alone because it already has a poster.
              it.poster_path = st.hit.poster_path;
            }
            touched++;
          }
          if (!touched) continue;
          const ok = await this._persistListItems(list, items, true);
          if (ok) { fixedLists++; fixedEntries += touched; }
          else failed++;
          this.issueProgress = `Repaired ${fixedEntries} of ${this.listSync.entries} list entries...`;
        }

        await this.fetchLists();
        this.scanListSync();
        this.listSyncBusy = false;
        this.issueProgress = '';
        this.issuePhase = failed
          ? `Updated ${fixedEntries} entries across ${fixedLists} lists. ${failed} list${failed === 1 ? '' : 's'} rejected — check the console.`
          : `✅ Updated ${fixedEntries} list entr${fixedEntries === 1 ? 'y' : 'ies'} across ${fixedLists} list${fixedLists === 1 ? '' : 's'}.`;
      },

      _issueScopeLogs() {
        const all = this.logs.filter(l => l.movie_title && String(l.movie_title).trim());
        if (this.issueScope === 'all') return all;
        const me = (this.username || '').trim().toLowerCase();
        return all.filter(l => (l.username || '').trim().toLowerCase() === me);
      },

      // Films are grouped by title+year, since that is the unit a fix applies to.
      _issueGroups(logs) {
        const groups = new Map();
        for (const l of logs) {
          const key = this._normTitle(l.movie_title) + '|' + String(l.release_year || '').trim();
          let g = groups.get(key);
          if (!g) {
            g = { key, title: l.movie_title, year: String(l.release_year || '').trim(), rows: [], ids: new Set(), members: new Set() };
            groups.set(key, g);
          }
          g.rows.push(l);
          if (l.tmdb_id && String(l.tmdb_id).trim()) g.ids.add(String(l.tmdb_id).trim());
          g.members.add(l.username || 'Anonymous');
        }
        return groups;
      },

      scanForIssues() {
        this.issueBusy = true;
        this.issueVerified = false;
        this.issuePhase = 'Checking your library...';

        const logs = this._issueScopeLogs();
        const groups = this._issueGroups(logs);

        // A single TMDB id cannot be two different films, nor two different
        // release years. Both are proof of a bad mapping somewhere.
        const byId = new Map();
        for (const g of groups.values()) {
          for (const id of g.ids) {
            let e = byId.get(id);
            if (!e) { e = { titles: new Set(), years: new Set(), groups: [] }; byId.set(id, e); }
            e.titles.add(this._normTitle(g.title));
            if (g.year) e.years.add(g.year);
            e.groups.push(g);
          }
        }

        const issues = [];
        const seen = new Set();
        const add = (g, kind, severity, detail) => {
          const key = g.key + '::' + kind;
          if (seen.has(key)) return;
          seen.add(key);
          issues.push({
            key, kind, severity,
            title: g.title, year: g.year,
            tmdbId: [...g.ids][0] || '',
            rowIds: g.rows.map(r => r.id),
            members: [...g.members],
            count: g.rows.length,
            detail,
            suggested: null,
            actual: null,
            selected: false
          });
        };

        for (const [id, e] of byId) {
          if (e.titles.size > 1) {
            // Exclude by identity, not by title prefix. Every entry in a
            // serial like Fantômas begins with the same word, so a prefix
            // filter wiped the entire list.
            for (const g of e.groups) {
              const others = e.groups
                .filter(o => o.key !== g.key)
                .map(o => `${o.title}${o.year ? ' (' + o.year + ')' : ''}`);
              add(g, 'shared-id', 'high',
                others.length
                  ? `TMDB id ${id} is also used by: ${others.join(', ')}`
                  : `TMDB id ${id} is used by more than one film here`);
            }
          } else if (e.years.size > 1) {
            for (const g of e.groups) add(g, 'shared-id-years', 'high', `TMDB id ${id} is shared across release years ${[...e.years].sort().join(' and ')} — a remake has probably swallowed the original`);
          }
        }

        for (const g of groups.values()) {
          if (g.ids.size > 1) add(g, 'split-id', 'high', `The same film is linked to ${g.ids.size} different TMDB ids: ${[...g.ids].join(', ')}`);
          if (g.ids.size === 0) add(g, 'unmatched', 'medium', 'Never matched to TMDB, so it has no poster or director');
          if (!g.year) add(g, 'no-year', 'low', 'No release year, which is what keeps a remake from stealing the match');
          const id = [...g.ids][0];
          const yr = parseInt(g.year, 10);
          if (id && /^\d+$/.test(id) && yr && yr <= 2015 && Number(id) > 900000) {
            add(g, 'id-magnitude', 'medium', `TMDB ids are handed out in order, so id ${id} belongs to a recent addition — unlikely for a ${yr} film`);
          }
        }

        issues.forEach(i => this._attachListRefs(i));
        const visible = issues.filter(i => !this.isDismissed(i));
        issues.length = 0; issues.push(...visible);

        const rank = { high: 0, medium: 1, low: 2 };
        issues.sort((a, b) => rank[a.severity] - rank[b.severity] || b.count - a.count || a.title.localeCompare(b.title));

        this.issueResults = {
          issues,
          scanned: logs.length,
          films: groups.size,
          high: issues.filter(i => i.severity === 'high').length,
          medium: issues.filter(i => i.severity === 'medium').length,
          low: issues.filter(i => i.severity === 'low').length
        };
        this.scanListSync();
        this.issueBusy = false;
        this.issuePhase = '';
        this.issueProgress = '';
      },

      // Ask TMDB what each linked id actually is, and where it disagrees
      // with the log, work out what it should have been.
      async deepVerifyIssues() {
        if (this.issueBusy) return;
        const logs = this._issueScopeLogs();
        // Films with no id at all were previously skipped, so "never matched
        // to TMDB" rows were reported and then never actually looked up.
        const groups = [...this._issueGroups(logs).values()];
        if (!groups.length) { this.issuePhase = 'No films in scope.'; return; }

        // No practical cap: a club library runs to several thousand distinct
        // films and truncating would quietly leave half of them unverified.
        // Progress is reported and the run can be stopped at any point.
        const queue = groups;
        this.issueBusy = true;
        this.issueCancel = false;
        this.issuePhase = 'Asking TMDB what each film actually is...';
        const started = Date.now();
        let done = 0, lastPaint = 0;
        const findings = [];
        const cleanKeys = new Set();

        // Ids repeat across groups, so cache the lookups.
        const detailCache = new Map();
        const altCache = new Map();
        const tvCache = new Map();

        // Only called on the mismatch path, so bounded by however many films
        // actually look wrong rather than by library size.
        const getAltTitles = async (id) => {
          if (altCache.has(id)) return altCache.get(id);
          let out = [];
          try {
            const res = await fetch(`https://api.themoviedb.org/3/movie/${id}/alternative_titles?api_key=${TMDB_API_KEY}`);
            if (res.ok) {
              const j = await res.json();
              out = (j.titles || j.results || []).map(t => t.title).filter(Boolean);
            }
          } catch (e) { /* no alternatives available */ }
          altCache.set(id, out);
          return out;
        };

        const isProbablyTv = async (title, year) => {
          const key = title + '|' + year;
          if (tvCache.has(key)) return tvCache.get(key);
          let hit = false;
          try {
            const res = await fetch(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(title)}`);
            if (res.ok) {
              const j = await res.json();
              const want = this._normTitle(title);
              hit = (j.results || []).some(r => this._normTitle(r.name) === want || this._normTitle(r.original_name) === want);
            }
          } catch (e) { /* inconclusive */ }
          tvCache.set(key, hit);
          return hit;
        };
        const getDetail = async (id, media) => {
          const ck = media + ':' + id;
          if (detailCache.has(ck)) return detailCache.get(ck);
          let d = null;
          try {
            const res = await fetch(this._tmdbUrl(media, `/${id}`));
            if (res.ok) {
              const j = await res.json();
              d = {
                id: String(id),
                media,
                title: (media === 'tv' ? j.name : j.title) || '',
                alt: (media === 'tv' ? j.original_name : j.original_title) || '',
                year: (media === 'tv' ? j.first_air_date : j.release_date) || '',
                poster_path: j.poster_path || null
              };
              if (d.year) d.year = d.year.substring(0, 4);
            }
          } catch (e) { /* unreachable id */ }
          detailCache.set(ck, d);
          return d;
        };

        // A title only earns the "probably TV" note when TMDB's film side
        // offers nothing by that name. Plenty of films share a title with
        // some series; that alone means nothing.
        const describeMiss = async (title, year, found) => {
          const hasFilmCandidate = (found.candidates || []).some(c => c.exact);
          if (!hasFilmCandidate && await isProbablyTv(title, year)) {
            return { note: ' — TMDB has no film by this name, but does have a TV series, which it keeps in a separate database', tv: true };
          }
          if (found.reason === 'ambiguous-no-year' || found.reason === 'ambiguous-close') {
            return { note: ' — several TMDB entries match equally well, so pick one by hand', tv: false };
          }
          return { note: '', tv: false };
        };

        await pool(queue, 6, async (g) => {
          if (this.issueCancel) { done++; return; }
          const ids = [...g.ids];
          const want = this._normTitle(g.title);

          if (ids.length === 0) {
            const found = await this._findTmdbMovieDetailed(g.title, g.year);
            if (found.match) {
              findings.push({
                g, kind: 'unlinked', severity: 'medium',
                actual: null,
                suggested: { id: String(found.match.id), title: found.match.title,
                             poster_path: found.match.poster_path,
                             media: found.match.media || 'movie',
                             year: found.match.release_date ? found.match.release_date.substring(0, 4) : '' },
                detail: found.match.media === 'tv'
                  ? 'Not linked yet — found on TMDB as a TV series'
                  : 'Not linked to TMDB yet'
              });
            } else {
              const miss = await describeMiss(g.title, g.year, found);
              findings.push({
                g, kind: 'unlinked', severity: 'medium', notFilm: miss.tv,
                actual: null, suggested: null,
                detail: `Could not be matched on TMDB${miss.note}`
              });
            }
            done++;
            return;
          }

          // Check EVERY id the group uses, not just the first. A film split
          // across two ids can only be resolved by looking at both.
          const gMedia = this._media(g.rows[0]);
          const checked = [];
          for (const id of ids) {
            const d = await getDetail(id, gMedia);
            if (d) checked.push(d);
          }

          // Same tolerance the matcher uses, so verification and matching
          // never disagree about what counts as the right film.
          const gapOf = (c) => (!g.year || !c.year) ? 0 : Math.abs(parseInt(c.year, 10) - parseInt(g.year, 10));
          const fits = checked.filter(c => {
            const titleOk = this._normTitle(c.title) === want || this._normTitle(c.alt) === want;
            return titleOk && gapOf(c) <= 4;
          });

          if (fits.length === 1 && ids.length === 1) {
            cleanKeys.add(g.key);
            // Right film, but the log's year disagrees with TMDB. Harmless
            // on its own, except the same film logged under two years shows
            // up twice in stats and splits into two groups everywhere.
            const gap = gapOf(fits[0]);
            if (gap >= 1 && fits[0].year) {
              findings.push({
                g, kind: 'year-drift', severity: 'low', fixKind: 'year',
                actual: { id: fits[0].id, title: fits[0].title, year: fits[0].year },
                suggested: { id: fits[0].id, title: fits[0].title, poster_path: fits[0].poster_path, year: fits[0].year },
                detail: `Correctly linked, but logged as ${g.year} while TMDB says ${fits[0].year}`
              });
            }
          } else if (fits.length >= 1 && ids.length > 1) {
            // Split across ids, and at least one of them is right.
            // Consolidate onto the id most of the logs already use;
            // fall back to the lower (older, canonical) TMDB entry.
            const usage = new Map();
            for (const r of g.rows) {
              const k = String(r.tmdb_id || '').trim();
              if (k) usage.set(k, (usage.get(k) || 0) + 1);
            }
            fits.sort((a, b) => (usage.get(b.id) || 0) - (usage.get(a.id) || 0) || Number(a.id) - Number(b.id));
            const winner = fits[0];
            const losers = ids.filter(x => String(x) !== winner.id);
            findings.push({
              g, kind: 'split', severity: 'high',
              actual: { id: losers.join(', '), title: winner.title, year: winner.year },
              suggested: { id: winner.id, title: winner.title, poster_path: winner.poster_path, year: winner.year },
              detail: `Split across ${ids.length} TMDB ids (${ids.join(', ')}). ${winner.id} is the correct one.`
            });
          } else if (fits.length === 0 && checked.length) {
            const wrong = checked[0];

            // Before calling it mislinked, check what else TMDB calls this
            // film. Apur Sansar is released as The World of Apu; the link
            // was right and only the title comparison was wrong.
            let aka = false;
            if (gapOf(wrong) <= 4) {
              const alts = await getAltTitles(wrong.id);
              aka = alts.some(t => this._normTitle(t) === want);
            }

            if (aka) {
              cleanKeys.add(g.key);
            } else {
              const found = await this._findTmdbMovieDetailed(g.title, g.year);
              const better = found.match;
              const miss = better ? { note: '', tv: false } : await describeMiss(g.title, g.year, found);
              const tvNote = miss.note;
              findings.push({
                g, kind: 'wrong', severity: 'high',
                notFilm: miss.tv,
                actual: { id: wrong.id, title: wrong.title, year: wrong.year },
                suggested: better && !ids.includes(String(better.id))
                  ? { id: String(better.id), title: better.title, poster_path: better.poster_path,
                      media: better.media || 'movie',
                      year: better.release_date ? better.release_date.substring(0, 4) : '' }
                  : null,
                detail: `Currently linked to "${wrong.title}"${wrong.year ? ' (' + wrong.year + ')' : ''}${tvNote}`
              });
            }
          } else if (fits.length > 1) {
            // More than one TMDB entry legitimately matches. Rare, and not
            // something to resolve silently.
            findings.push({
              g, kind: 'duplicate-entry', severity: 'medium',
              actual: { id: ids.join(', '), title: g.title, year: g.year },
              suggested: null,
              detail: `TMDB has ${fits.length} entries that both match this film (${fits.map(f => f.id).join(', ')}). Pick one by hand.`
            });
          }

          done++;
          const now = Date.now();
          if (now - lastPaint > 250 || done === queue.length) {
            lastPaint = now;
            const rate = done / Math.max(1, (now - started) / 1000);
            const left = Math.max(0, queue.length - done);
            const eta = rate > 0 ? Math.ceil(left / rate) : 0;
            const mins = Math.floor(eta / 60), secs = eta % 60;
            this.issueProgress = `Checked ${done} of ${queue.length} films — ${findings.length} need attention`
              + (left > 0 ? ` — about ${mins ? mins + 'm ' : ''}${secs}s left` : '');
          }
        });

        const verified = findings.map(m => ({
          key: m.g.key + '::verified',
          kind: 'verified-' + m.kind,
          fixKind: m.fixKind || 'relink',
          severity: m.severity,
          title: m.g.title, year: m.g.year,
          tmdbId: [...m.g.ids][0] || '',
          rowIds: m.g.rows.map(r => r.id),
          members: [...m.g.members],
          count: m.g.rows.length,
          detail: m.detail,
          notFilm: !!m.notFilm,
          actual: m.actual,
          suggested: m.suggested,
          selected: !!m.suggested && m.kind !== 'year-drift'
        }));

        verified.forEach(v => this._attachListRefs(v));

        // Verification is authoritative. A structural guess about a film
        // that TMDB has now confirmed is correct gets withdrawn rather than
        // left sitting there as "likely wrong" with no fix available.
        const verifiedKeys = new Set(verified.map(v => v.key.split('::')[0]));
        const kept = (this.issueResults ? this.issueResults.issues : []).filter(i => {
          const gk = i.key.split('::')[0];
          if (this.isDismissed(i)) return false;
          if (cleanKeys.has(gk)) return false;           // confirmed correct
          if (verifiedKeys.has(gk)) return false;        // superseded by a real finding
          // An unlinked film that verification never reached (a cancelled
          // run) keeps its quick-scan flag rather than vanishing.
          return true;
        });

        const rank = { high: 0, medium: 1, low: 2 };
        const issues = [...verified.filter(v => !this.isDismissed(v)), ...kept].sort((a, b) =>
          rank[a.severity] - rank[b.severity] ||
          (b.suggested ? 1 : 0) - (a.suggested ? 1 : 0) ||
          b.count - a.count);

        this.issueResults = {
          issues,
          scanned: logs.length,
          films: groups.length,
          high: issues.filter(i => i.severity === 'high').length,
          medium: issues.filter(i => i.severity === 'medium').length,
          low: issues.filter(i => i.severity === 'low').length,
          fixable: issues.filter(i => i.suggested).length
        };
        this.issueVerified = true;
        this.issueBusy = false;
        this.issuePhase = this.issueCancel
          ? `Stopped after ${done} films. ${verified.length} are linked to the wrong entry so far.`
          : `Checked ${queue.length} films. ${verified.length} are linked to the wrong entry.`;
        this.issueCancel = false;
        this.issueProgress = '';
      },

      toggleAllIssues(v) {
        if (!this.issueResults) return;
        this.issueResults.issues.forEach(i => { if (i.suggested) i.selected = v; });
      },
      selectedIssueCount() {
        return this.issueResults ? this.issueResults.issues.filter(i => i.selected && i.suggested).length : 0;
      },

      // Batch repair. Writes the corrected id, poster and director to every
      // affected row at once, which is the whole point of the exercise.
      async applyIssueFixes() {
        const chosen = (this.issueResults ? this.issueResults.issues : []).filter(i => i.selected && i.suggested);
        if (!chosen.length) return;
        const client = getDb();
        if (!client) return;
        if (!confirm(`Repoint ${chosen.length} film${chosen.length === 1 ? '' : 's'} at their correct TMDB entries? This updates every affected log.`)) return;

        this.issueFixBusy = true;
        let fixed = 0, failed = 0, done = 0;
        let listsFixed = 0, listEntries = 0, listsFailed = 0;

        await pool(chosen, 4, async (issue) => {
          // A year fix corrects the log, not the link, so it never touches
          // tmdb_id, poster or director.
          const isYearFix = issue.fixKind === 'year';
          const media = (issue.suggested && issue.suggested.media) || 'movie';
          const updates = isYearFix
            ? { release_year: String(issue.suggested.year) }
            : { tmdb_id: String(issue.suggested.id), poster_path: issue.suggested.poster_path || '' };
          if (!isYearFix && !this.mediaTypeUnsupported) updates.media_type = media;

          if (!isYearFix) {
            try {
              const res = await fetch(this._tmdbUrl(media, `/${issue.suggested.id}`, 'append_to_response=credits'));
              if (res.ok) {
                const d = await res.json();
                if (!updates.poster_path && d.poster_path) updates.poster_path = d.poster_path;
                const dir = d.credits && d.credits.crew && d.credits.crew.find(c => c.job === 'Director');
                if (dir) updates.director = dir.name;
                else if (media === 'tv' && d.created_by && d.created_by.length) updates.director = d.created_by[0].name;
              }
            } catch (e) { /* director is optional */ }
          }

          let { error } = await client.from('logs').update(updates).in('id', issue.rowIds);
          if (error && this._isMissingMediaColumn(error)) {
            // Column not added yet: still repair the link rather than fail.
            this.mediaTypeUnsupported = true;
            const { media_type, ...rest } = updates;
            ({ error } = await client.from('logs').update(rest).in('id', issue.rowIds));
          }
          if (error) { failed++; console.error('[issue fix]', issue.title, error.message); }
          else { fixed++; issue.fixed = true; issue.selected = false; }

          // Carry the same correction into whichever lists were ticked.
          for (const ref of (issue.lists || [])) {
            if (!ref.selected) continue;
            const list = this.lists.find(l => l.id === ref.id);
            if (!list) continue;
            const items = this.getListItems(list);
            let touched = 0;
            for (const idx of ref.indices) {
              const it = items[idx];
              if (!it) continue;
              if (isYearFix) { it.release_year = String(issue.suggested.year); touched++; continue; }
              it.id = String(issue.suggested.id);
              it.media_type = media;
              if (updates.poster_path) it.poster_path = updates.poster_path;
              if (ref.retitle) {
                if (issue.suggested.title) it.title = issue.suggested.title;
                if (issue.suggested.year) it.release_year = issue.suggested.year;
              }
              touched++;
            }
            if (!touched) continue;
            const ok = await this._persistListItems(list, items, true);
            if (ok) { listsFixed++; listEntries += touched; }
            else listsFailed++;
          }

          done++;
          this.issueProgress = `Repaired ${fixed} of ${chosen.length}...`;
        });

        await Promise.all([this.fetchLogs(), this.fetchLists()]);
        this.issueFixBusy = false;
        this.issueProgress = '';
        const listNote = listsFixed
          ? ` ${listEntries} list entr${listEntries === 1 ? 'y' : 'ies'} updated across ${listsFixed} list${listsFixed === 1 ? '' : 's'}.`
          : '';
        const listFail = listsFailed ? ` ${listsFailed} list update${listsFailed === 1 ? '' : 's'} were rejected — check the console.` : '';
        this.issuePhase = (failed
          ? `Repaired ${fixed}, ${failed} failed — check the console.`
          : `✅ Repaired ${fixed} film${fixed === 1 ? '' : 's'}.`) + listNote + listFail;
        if (this.issueResults) this.issueResults.issues = this.issueResults.issues.filter(i => !i.fixed);
      },

      // Escape hatch for anything the scanner cannot resolve on its own.
      fixIssueManually(issue) {
        if (!issue || !issue.rowIds) return;
        const target = this.logs.find(l => issue.rowIds.includes(l.id));
        if (!target) return;
        this.showIssueScanModal = false;
        this.openLogPosterPicker(target);
        this.relinkAllMembers = true;
        this.relinkQuery = issue.title + (issue.year ? ' ' + issue.year : '');
        this.searchRelink();
      },

      _loadDismissed() {
        try { this.dismissedIssues = JSON.parse(localStorage.getItem('jawn_dismissed_issues') || '[]'); }
        catch (e) { this.dismissedIssues = []; }
      },
      _saveDismissed() {
        try { localStorage.setItem('jawn_dismissed_issues', JSON.stringify(this.dismissedIssues)); } catch (e) {}
      },
      isDismissed(issue) {
        return this.dismissedIssues.includes(issue.key.split('::')[0]);
      },
      dismissIssue(issue) {
        const gk = issue.key.split('::')[0];
        if (!this.dismissedIssues.includes(gk)) this.dismissedIssues.push(gk);
        this._saveDismissed();
        if (this.issueResults) {
          this.issueResults.issues = this.issueResults.issues.filter(i => i.key !== issue.key);
        }
      },
      restoreDismissed() {
        this.dismissedIssues = [];
        this._saveDismissed();
        this.scanForIssues();
      },

      openIssueScanner() {
        this._loadDismissed();
        this.showIssueScanModal = true;
        this.issueResults = null;
        this.issueVerified = false;
        this.issuePhase = '';
        this.issueProgress = '';
        this.scanForIssues();
      },

      async openLogPosterPicker(log) {
        this.logPosterPickerTarget = log;
        this.logPosterOptions = [];
        this.relinkQuery = '';
        this.relinkResults = [];
        this.relinkBusy = false;
        this.relinkAllMembers = false;
        this.showLogPosterModal = true;
        this._posterMedia = this._media(log);
        if (log.tmdb_id) {
          try {
            const res = await fetch(this._tmdbUrl(this._media(log), `/${log.tmdb_id}/images`));
            if (res.ok) {
              const data = await res.json();
              if (data.posters) this.logPosterOptions = data.posters.slice(0, 12).map(p => p.file_path);
            }
          } catch(e) {}
        }
      },
      // No matcher gets every title right. This is the escape hatch:
      // search TMDB yourself and repoint the log at the correct film.
      relinkQuery: '',
      relinkResults: [],
      relinkBusy: false,
      relinkAllMembers: false,

      async searchRelink() {
        const q = (this.relinkQuery || '').trim();
        if (!q) { this.relinkResults = []; return; }
        this.relinkBusy = true;
        this.relinkResults = await this._searchAny(q);
        this.relinkBusy = false;
      },

      // Repoints every log of this film for this member, so a title watched
      // three times is corrected once rather than three times.
      async relinkLog(movie) {
        const target = this.logPosterPickerTarget;
        if (!target) return;
        const client = getDb();
        if (!client) return;
        const oldId = String(target.tmdb_id || '').trim();

        this.relinkBusy = true;
        const updates = { tmdb_id: String(movie.id), poster_path: movie.poster_path, movie_title: movie.title };
        if (movie.release_year) updates.release_year = movie.release_year;
        if (!this.mediaTypeUnsupported) updates.media_type = movie.media || 'movie';

        try {
          const res = await fetch(`https://api.themoviedb.org/3/movie/${movie.id}/credits?api_key=${TMDB_API_KEY}`);
          if (res.ok) {
            const credits = await res.json();
            const dir = credits.crew && credits.crew.find(c => c.job === 'Director');
            if (dir) updates.director = dir.name;
          }
        } catch (e) { /* director is optional */ }

        // A bad TMDB mapping is wrong for the whole club, not just for you,
        // so offer to repoint every member's copy in one go.
        const siblings = this.logs.filter(l =>
          (this.relinkAllMembers || (l.username || '') === (target.username || '')) &&
          this._normTitle(l.movie_title) === this._normTitle(target.movie_title) &&
          String(l.release_year || '') === String(target.release_year || ''));
        const ids = siblings.length ? siblings.map(l => l.id) : [target.id];
        const members = new Set(siblings.map(l => l.username || ''));

        const { error } = await client.from('logs').update(updates).in('id', ids);
        if (error) { this.relinkBusy = false; alert('Could not relink: ' + error.message); return; }

        // The same film sits in custom lists under the old id, so offer to
        // repoint those too rather than leaving them silently wrong.
        const refs = [];
        for (const list of this.lists) {
          const listItems = this.getListItems(list);
          const hits = [];
          listItems.forEach((m, i) => {
            const byId = oldId && m.id && String(m.id) === oldId;
            const byTitle = m.title && this._normTitle(m.title) === this._normTitle(target.movie_title);
            if (byId || byTitle) hits.push(i);
          });
          if (hits.length) refs.push({ list, hits, items: listItems });
        }

        let listEntries = 0;
        if (refs.length) {
          const names = refs.map(r => `• ${r.list.title} (${r.list.username})`).join('\n');
          if (confirm(`This film also appears in ${refs.length} list${refs.length === 1 ? '' : 's'}:\n\n${names}\n\nUpdate those entries too?`)) {
            for (const r of refs) {
              for (const i of r.hits) {
                const it = r.items[i];
                if (!it) continue;
                it.id = String(movie.id);
                it.media_type = movie.media || 'movie';
                if (movie.poster_path) it.poster_path = movie.poster_path;
                listEntries++;
              }
              await this._persistListItems(r.list, r.items, true);
            }
            await this.fetchLists();
          }
        }
        this.relinkBusy = false;

        this.relinkQuery = '';
        this.relinkResults = [];
        this.showLogPosterModal = false;
        await this.fetchLogs();
        alert(`Relinked ${ids.length} log${ids.length === 1 ? '' : 's'}`
          + (members.size > 1 ? ` across ${members.size} members` : '')
          + (listEntries ? ` and ${listEntries} list entr${listEntries === 1 ? 'y' : 'ies'}` : '')
          + ` to "${movie.title}".`);
      },

      async confirmLogPosterSwap(newPosterPath) {
        if (!this.logPosterPickerTarget) return;
        const client = getDb();
        if (client) {
          await client.from('logs').update({ poster_path: newPosterPath }).eq('id', this.logPosterPickerTarget.id);
          this.logPosterPickerTarget.poster_path = newPosterPath;
          await this.fetchLogs();
        }
        this.showLogPosterModal = false;
      }
    };
  }
</script>
